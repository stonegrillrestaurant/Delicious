<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Courtside Gatherings Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <main class="max-w-3xl mx-auto p-5">
    <header class="flex items-start justify-between gap-4 py-6 border-b border-slate-800">
      <div>
        <h1 class="text-3xl font-bold">Courtside Gatherings</h1>
        <p class="text-slate-400 mt-1">Pickleball Booking · Brgy. Lunang, Hilongos, Leyte</p>
      </div>
      <button id="googleBtn" class="bg-white text-slate-900 font-semibold rounded-xl px-5 py-3">Sign in with Google</button>
    </header>

    <section class="mt-6 bg-slate-900 border border-slate-800 rounded-3xl p-5">
      <label class="block text-xs tracking-[.25em] font-bold text-slate-400 mb-3">CHOOSE DATE</label>
      <input id="dateInput" type="date" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-lg" />
      <div class="mt-5 text-sm text-slate-300">
        <div class="font-semibold text-slate-400">PRIVATE RENTAL</div>
        <div>Courts 1–4 ₱250/hr · Courts 5–6 ₱350/hr</div>
      </div>
    </section>

    <section class="mt-5 flex flex-wrap gap-3 text-sm font-semibold">
      <span class="bg-emerald-700 px-4 py-2 rounded-lg">AVAILABLE</span>
      <span class="bg-teal-600 px-4 py-2 rounded-lg">OPEN PLAY · TAP TO JOIN</span>
      <span class="bg-orange-700 px-4 py-2 rounded-lg">PRIVATE · UNAVAILABLE</span>
    </section>

    <section id="statusBox" class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-4 hidden"></section>
    <section id="schedule" class="mt-8">
      <div class="text-center text-slate-500 text-xl py-12">Loading schedule…</div>
    </section>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuFaPFfKKYhheMmemn0qqoc2cGiTrJzUw",
  authDomain: "stone-grill-payroll.firebaseapp.com",
  projectId: "stone-grill-payroll",
  storageBucket: "stone-grill-payroll.firebasestorage.app",
  messagingSenderId: "255528914541",
  appId: "1:255528914541:web:d58d9731a29d27fc253964"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const $ = (id) => document.getElementById(id);
const statusBox = $("statusBox");
const schedule = $("schedule");
const dateInput = $("dateInput");

function showStatus(type, title, detail) {
  statusBox.classList.remove("hidden");
  statusBox.innerHTML = `
    <div class="font-bold">${title}</div>
    <div class="mt-1 text-sm text-slate-300 break-words">${detail || ""}</div>
  `;
  statusBox.className = "mt-8 rounded-2xl border p-4 " +
    (type === "error" ? "border-red-700 bg-red-950/50" : "border-slate-700 bg-slate-900");
}

function todayLocal() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

dateInput.value = todayLocal();

$("googleBtn").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    showStatus("error", "Google sign-in error", `${err.code || "unknown"}: ${err.message}`);
  }
});

onAuthStateChanged(auth, (user) => {
  $("googleBtn").textContent = user ? (user.displayName || "Signed in") : "Sign in with Google";
});

let unsubOpen = null;
let unsubBookings = null;
let openLoaded = false;
let bookingsLoaded = false;
let openItems = [];
let bookingItems = [];

function stopListeners() {
  if (unsubOpen) unsubOpen();
  if (unsubBookings) unsubBookings();
  unsubOpen = null;
  unsubBookings = null;
}

function render() {
  if (!openLoaded || !bookingsLoaded) return;

  const courts = [1,2,3,4,5,6];
  schedule.innerHTML = courts.map(courtId => {
    const ops = openItems.filter(x => Number(x.courtId) === courtId);
    const bks = bookingItems.filter(x => Number(x.courtId) === courtId && x.status !== "cancelled");

    let body = '<div class="text-emerald-400 font-semibold">Available</div>';
    if (ops.length) {
      body = ops.map(x => `<div class="mt-2 bg-teal-700/40 border border-teal-600 rounded-xl p-3">
        <div class="font-semibold">Open Play</div>
        <div class="text-sm text-slate-300">${x.startTime || "?"}–${x.endTime || "?"} · ₱${x.pricePerPlayer ?? "?"}/player</div>
      </div>`).join("");
    } else if (bks.length) {
      body = bks.map(x => `<div class="mt-2 bg-orange-800/40 border border-orange-700 rounded-xl p-3">
        <div class="font-semibold">Private Booking</div>
        <div class="text-sm text-slate-300">${x.startTime || "?"}–${x.endTime || "?"}</div>
      </div>`).join("");
    }

    return `<article class="mb-4 bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold">Court ${courtId}</h2>
        <span class="text-slate-400">₱${courtId >= 5 ? 350 : 250}/hr</span>
      </div>
      <div class="mt-3">${body}</div>
    </article>`;
  }).join("");

  showStatus("info", "Firebase connected", `Loaded schedule for ${dateInput.value}. Open Play: ${openItems.length}, private bookings: ${bookingItems.length}.`);
}

function loadSchedule() {
  stopListeners();
  openLoaded = false;
  bookingsLoaded = false;
  openItems = [];
  bookingItems = [];
  schedule.innerHTML = '<div class="text-center text-slate-500 text-xl py-12">Loading schedule…</div>';
  statusBox.classList.add("hidden");

  const selectedDate = dateInput.value;

  const openQ = query(collection(db, "openPlaySessions"), where("date", "==", selectedDate));
  unsubOpen = onSnapshot(openQ,
    (snap) => {
      openItems = snap.docs.map(d => ({id:d.id, ...d.data()}));
      openLoaded = true;
      render();
    },
    (err) => {
      openLoaded = true;
      showStatus("error", "Open Play read failed", `${err.code || "unknown"}: ${err.message}`);
      schedule.innerHTML = '<div class="text-red-400 text-center py-10">Firebase could not read Open Play data.</div>';
    }
  );

  const bookingQ = query(collection(db, "bookings"), where("date", "==", selectedDate));
  unsubBookings = onSnapshot(bookingQ,
    (snap) => {
      bookingItems = snap.docs.map(d => ({id:d.id, ...d.data()}));
      bookingsLoaded = true;
      render();
    },
    (err) => {
      bookingsLoaded = true;
      showStatus("error", "Private booking read failed", `${err.code || "unknown"}: ${err.message}`);
      schedule.innerHTML = '<div class="text-red-400 text-center py-10">Firebase could not read private booking data.</div>';
    }
  );
}

dateInput.addEventListener("change", loadSchedule);
loadSchedule();
</script>
</body>
</html>
