<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pick all AD-Ventures | Live TV Display</title>
  
  <meta property="og:image" content="https://stonegrillresto.net/pickle-dashboard/og-image.png">
  <meta property="og:title" content="Pick all AD-Ventures | Pickleball Court">
  <meta property="og:description" content="Eza Ventures Inc. Pickleball Court & Sports Arena">
  
  <link rel="manifest" href="/pickle-dashboard/manifest.json">
  <meta name="theme-color" content="#065f46">
  <link rel="apple-touch-icon" href="/pickle-dashboard/pwa-icon.PNG">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .badge-beginner { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-pro { background-color: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    
    /* Hide scrollbar for a clean TV display */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="bg-slate-800 border-b border-slate-700 shadow-xl py-4 px-6 flex justify-between items-center sticky top-0 z-50">
    <div>
      <div class="bg-amber-500 text-slate-950 font-black px-3 py-1 rounded-lg text-sm tracking-wider inline-block mb-1">LIVE QUEUE</div>
      <h1 class="text-2xl font-black tracking-wide text-white">PICK ALL AD-VENTURES</h1>
    </div>
    <div class="text-right">
      <div id="clock" class="text-3xl font-black text-emerald-400">00:00</div>
      <div id="sync-status" class="text-xs text-slate-400 font-bold uppercase mt-1">Syncing...</div>
    </div>
  </header>

  <main class="flex-1 p-6 flex flex-col gap-6">
    
    <!-- Active Courts Grid (Matches Admin Panel Visuals) -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5">
      <h2 class="text-xl font-black text-white mb-4 border-b border-slate-700 pb-2">Live Courts</h2>
      <div id="playing-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Court Cards will inject here -->
      </div>
    </section>

    <!-- Waiting Queue Table -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5 flex-1 flex flex-col">
      <div class="flex justify-between items-end border-b border-slate-700 pb-2 mb-4">
        <h2 class="text-xl font-black text-white">On Deck / Waiting</h2>
        <span class="text-sm font-bold text-slate-400">Listed by arrival order</span>
      </div>
      
      <div class="overflow-y-auto flex-1 max-h-[400px] border border-slate-700 rounded-lg">
        <table class="w-full text-left text-sm relative">
          <thead class="bg-slate-900 text-slate-400 sticky top-0 shadow-sm z-10">
            <tr>
              <th class="p-3 w-16 text-center">#</th>
              <th class="p-3">Player Name</th>
              <th class="p-3">Category</th>
              <th class="p-3 text-right">Time In</th>
            </tr>
          </thead>
          <tbody id="waiting-list" class="divide-y divide-slate-700/50 bg-slate-800">
            <!-- Waiting data will inject here -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbxpieHosDgAPmVFS9gSMUT0Igq_qNRxGHY9IhS--9unwCAzg3jATKZEgKPDLV9Z-F3Vqg/exec";

    // Update the live clock on the TV
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Fetch live data from Google Sheets
    async function fetchLiveData() {
      const statusIndicator = document.getElementById('sync-status');
      statusIndicator.innerText = "Syncing...";
      statusIndicator.classList.replace('text-emerald-500', 'text-slate-400');

      try {
        const response = await fetch(DATABASE_URL);
        const players = await response.json();
        
        renderTVDisplay(players);

        statusIndicator.innerText = "Live / Synced";
        statusIndicator.classList.replace('text-slate-400', 'text-emerald-500');
        statusIndicator.classList.replace('text-red-500', 'text-emerald-500');
      } catch (error) {
        console.error("Failed to fetch queue data:", error);
        statusIndicator.innerText = "Connection Lost";
        statusIndicator.classList.replace('text-emerald-500', 'text-red-500');
        statusIndicator.classList.replace('text-slate-400', 'text-red-500');
      }
    }

    function renderTVDisplay(players) {
      const playingContainer = document.getElementById('playing-list');
      const waitingContainer = document.getElementById('waiting-list');

      const playing = players.filter(p => p.Status === 'Playing');
      const waiting = players.filter(p => p.Status === 'Waiting');

      // 1. Render Courts (Exactly like Admin Panel)
      const courtNames = ["Court 1", "Court 2", "Court 3", "Court 4"];
      
      playingContainer.innerHTML = courtNames.map(courtName => {
        const matchPlayers = playing.filter(p => p.Assigned_Court === courtName);
        
        // Default State (Empty Court)
        let badgeHtml = `<span class="bg-slate-700 text-slate-300 text-[9px] font-bold px-2 py-0.5 rounded uppercase shadow-sm">OPEN</span>`;
        let contentHtml = `<div class="text-center text-xs text-slate-500 bg-slate-950/40 border-slate-800 italic rounded border border-dashed py-3">Court Open</div>`;

        // Active Match State
        if (matchPlayers.length > 0) {
          const cat = matchPlayers[0].Category;
          badgeHtml = `<span class="${cat === 'Beginner' ? 'badge-beginner' : 'badge-pro'} text-[9px] font-bold px-2 py-0.5 rounded uppercase shadow-sm">${cat}</span>`;
          
          contentHtml = `
            <div class="grid grid-cols-2 gap-1.5 text-xs">
              <div class="bg-slate-800 border border-slate-700 text-slate-200 p-1.5 rounded font-bold text-center truncate shadow-inner text-[10px]">${matchPlayers[0]?.Player_Name || 'P1'}</div>
              <div class="bg-slate-800 border border-slate-700 text-slate-200 p-1.5 rounded font-bold text-center truncate shadow-inner text-[10px]">${matchPlayers[1]?.Player_Name || 'P2'}</div>
              <div class="bg-slate-800 border border-slate-700 text-slate-200 p-1.5 rounded font-bold text-center truncate shadow-inner text-[10px]">${matchPlayers[2]?.Player_Name || 'P3'}</div>
              <div class="bg-slate-800 border border-slate-700 text-slate-200 p-1.5 rounded font-bold text-center truncate shadow-inner text-[10px]">${matchPlayers[3]?.Player_Name || 'P4'}</div>
            </div>
          `;
        }

        return `
          <div class="border rounded-xl p-4 bg-slate-900/60 border-slate-700 flex flex-col justify-between shadow-lg h-full">
            <div>
              <div class="flex justify-between items-center mb-3">
                <span class="font-black text-white text-sm">${courtName}</span>
                ${badgeHtml}
              </div>
              <div class="my-3 flex flex-col justify-center">
                ${contentHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 2. Render Waiting Queue Table
      if (waiting.length === 0) {
        waitingContainer.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500 italic font-bold">No players currently waiting.</td></tr>`;
      } else {
        waitingContainer.innerHTML = waiting.map((p, index) => `
          <tr class="hover:bg-slate-700/50 transition">
            <td class="p-3 text-center">
              <span class="${index < 4 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-400 bg-slate-800 border border-slate-700'} px-2 py-0.5 rounded font-black text-xs">#${index + 1}</span>
            </td>
            <td class="p-3 font-black text-white text-base">${p.Player_Name}</td>
            <td class="p-3"><span class="${p.Category === 'Beginner' ? 'badge-beginner' : 'badge-pro'} px-2 py-1 rounded text-[10px] font-bold uppercase">${p.Category}</span></td>
            <td class="p-3 text-slate-400 text-sm font-bold text-right">${p.Time_In}</td>
          </tr>
        `).join('');
      }
    }

    // Start App
    fetchLiveData();
    setInterval(fetchLiveData, 5000);
  </script>
</body>
</html>
