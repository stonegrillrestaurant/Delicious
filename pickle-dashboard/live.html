<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COURTSIDE GATHERINGS | Live Queue</title>
  <meta name="theme-color" content="#065f46">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .badge-beginner { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-intermediate { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .badge-advanced { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
    .badge-pro { background-color: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    /* Hide scrollbar for a clean app feel on mobile and TV */
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<!-- Responsive Body: Scrolls naturally on mobile, locks to screen on large TVs (lg) -->
<body class="bg-slate-950 text-slate-100 font-sans flex flex-col min-h-screen lg:h-screen lg:overflow-hidden">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 py-3 px-4 sm:px-6 lg:px-8 flex justify-between items-center shrink-0 sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-2 sm:gap-4 overflow-hidden">
      <div class="bg-amber-500 text-slate-950 font-black px-2 sm:px-3 py-1 rounded text-[9px] sm:text-xs lg:text-sm tracking-wider uppercase shadow-sm whitespace-nowrap">LIVE DISPLAY</div>
      <h1 class="text-sm sm:text-xl lg:text-3xl font-black tracking-widest text-white truncate">COURTSIDE GATHERINGS</h1>
    </div>
    <div class="flex items-center gap-3 sm:gap-6 flex-shrink-0 ml-2">
      <!-- CONNECTION STATUS INDICATOR -->
      <div id="sync-status" class="flex text-[9px] sm:text-[11px] lg:text-xs text-slate-500 font-black uppercase tracking-widest items-center gap-1.5 sm:gap-2 bg-slate-950/50 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg border border-slate-800">
        <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-slate-500 animate-pulse" id="sync-dot"></span> 
        <span id="sync-text" class="hidden sm:inline">CONNECTING...</span>
        <span id="sync-text-mobile" class="sm:hidden">SYNC</span>
      </div>
      <div id="clock" class="text-xl sm:text-3xl lg:text-5xl font-black text-emerald-400 tabular-nums tracking-tight">00:00</div>
    </div>
  </header>

  <!-- MAIN KANBAN AREA -->
  <main class="flex-1 w-full p-4 sm:p-5 lg:p-6 lg:overflow-hidden">
    <!-- Responsive Grid: 1 col on mobile, 2 on tablet, 4 on TV -->
    <div id="courts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 sm:gap-6 lg:h-full">
      <!-- Columns Rendered by JavaScript -->
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    const firebaseConfig = {
      apiKey: "AIzaSyDuFaPFfKKYhheMmemn0qqoc2cGiTrJzUw",
      authDomain: "stone-grill-payroll.firebaseapp.com",
      projectId: "stone-grill-payroll",
      storageBucket: "stone-grill-payroll.firebasestorage.app",
      messagingSenderId: "255528914541",
      appId: "1:255528914541:web:d58d9731a29d27fc253964"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const stateRef = doc(db, 'pickleball', 'currentState');

    onSnapshot(stateRef, (docSnap) => {
      const syncDot = document.getElementById('sync-dot');
      const syncText = document.getElementById('sync-text');
      const syncTextMobile = document.getElementById('sync-text-mobile');
      
      syncDot.classList.replace('bg-slate-500', 'bg-emerald-500');
      syncDot.classList.replace('bg-red-500', 'bg-emerald-500');
      
      syncText.innerText = "CLOUD SYNC ACTIVE";
      syncText.classList.replace('text-slate-500', 'text-emerald-500');
      syncText.classList.replace('text-red-500', 'text-emerald-500');
      
      syncTextMobile.innerText = "ACTIVE";
      syncTextMobile.classList.replace('text-slate-500', 'text-emerald-500');
      syncTextMobile.classList.replace('text-red-500', 'text-emerald-500');

      if (docSnap.exists()) {
        renderTVDisplay(docSnap.data());
      } else {
        renderTVDisplay({ courts: [], players: [], queues: { "1": [], "2": [], "3": [], "4": [] }});
      }
    }, (err) => {
        const syncDot = document.getElementById('sync-dot');
        const syncText = document.getElementById('sync-text');
        const syncTextMobile = document.getElementById('sync-text-mobile');
        
        syncDot.classList.replace('bg-emerald-500', 'bg-red-500');
        syncDot.classList.replace('bg-slate-500', 'bg-red-500');
        
        syncText.innerText = "DB BLOCKED";
        syncText.classList.replace('text-emerald-500', 'text-red-500');
        syncText.classList.replace('text-slate-500', 'text-red-500');
        
        syncTextMobile.innerText = "ERR";
        syncTextMobile.classList.replace('text-emerald-500', 'text-red-500');
        syncTextMobile.classList.replace('text-slate-500', 'text-red-500');
    });

    function getBadgeClass(cat) {
      if (cat === 'Beginner') return 'badge-beginner';
      if (cat === 'Intermediate') return 'badge-intermediate';
      if (cat === 'Advanced') return 'badge-advanced';
      return 'badge-pro';
    }

    function renderTVDisplay(state) {
      let courtsList = Array.isArray(state.courts) ? state.courts : [];
      if (courtsList.length < 4) {
         courtsList = [
            { id: 1, name: "Court 1", currentMatch: null, isExclusive: false, Renter: "" },
            { id: 2, name: "Court 2", currentMatch: null, isExclusive: false, Renter: "" },
            { id: 3, name: "Court 3", currentMatch: null, isExclusive: false, Renter: "" },
            { id: 4, name: "Court 4", currentMatch: null, isExclusive: false, Renter: "" }
         ];
      }
      
      const playersList = Array.isArray(state.players) ? state.players : [];
      const queues = state.queues || { "1": [], "2": [], "3": [], "4": [] };

      const courtsHTML = courtsList.map(court => {
         const courtIdStr = court.id.toString();
         
         // --- 1. COURT TOP CARD (Responsive Text) ---
         let courtCardHTML = '';
         if (court.isExclusive) {
             courtCardHTML = `
              <div class="p-4 sm:p-5 lg:p-6 bg-amber-500/10 relative border-b border-slate-700/50 flex-shrink-0">
                 <div class="absolute inset-0 bg-amber-500/5"></div>
                 <div class="flex justify-between items-center mb-4 lg:mb-6 pl-1 relative z-10">
                    <h3 class="font-black text-white text-xl sm:text-2xl lg:text-3xl tracking-wide">${court.name}</h3>
                    <span class="bg-amber-500/20 text-amber-300 font-black text-[10px] lg:text-xs px-2 lg:px-3 py-1 rounded uppercase border border-amber-500/30 tracking-widest shadow-sm">Exclusive</span>
                 </div>
                 <div class="flex flex-col items-center justify-center relative z-10 py-3 lg:py-4 min-h-[80px] lg:min-h-[110px]">
                    <p class="text-[10px] lg:text-xs text-amber-400 font-bold uppercase tracking-widest mb-1.5 opacity-80">Rented By</p>
                    <p class="text-2xl sm:text-3xl lg:text-4xl font-black text-white truncate px-2 text-center w-full">${court.Renter}</p>
                 </div>
              </div>`;
         } else {
             let badge = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] lg:text-xs px-2 lg:px-3 py-1 rounded font-black uppercase tracking-widest shadow-sm">OPEN PLAY</span>`;
             let playersHTML = '';
             
             if (!court.currentMatch || court.currentMatch.length === 0) {
                playersHTML = `<div class="col-span-2 flex items-center justify-center text-slate-500 font-black text-base lg:text-xl border-2 border-slate-700/60 border-dashed rounded-xl bg-slate-800/30 uppercase tracking-widest w-full h-full min-h-[80px] lg:min-h-[110px]">Court Available</div>`;
             } else {
                for(let i = 0; i < 4; i++) {
                   const pId = court.currentMatch[i];
                   const playerObj = pId ? playersList.find(p => p.id === pId) : null;
                   const pName = playerObj ? playerObj.name : '---';
                   const textStyle = playerObj ? 'text-white bg-slate-700/90 shadow-md border-slate-600' : 'text-slate-600 bg-slate-800/40 border-slate-700/50 border-dashed';
                   playersHTML += `<div class="border rounded-xl flex items-center justify-center p-2 lg:p-3 xl:p-4 text-base lg:text-lg xl:text-xl font-black uppercase text-center truncate ${textStyle}">${pName}</div>`;
                }
             }

             courtCardHTML = `
              <div class="p-4 sm:p-5 lg:p-6 bg-slate-900/80 border-b border-slate-700/80 flex-shrink-0">
                 <div class="flex justify-between items-center mb-4 lg:mb-5 pl-1">
                    <h3 class="font-black text-white text-xl sm:text-2xl lg:text-3xl tracking-wide">${court.name}</h3>
                    ${badge}
                 </div>
                 <div class="grid grid-cols-2 gap-2 lg:gap-3 min-h-[80px] lg:min-h-[110px]">
                    ${playersHTML}
                 </div>
              </div>`;
         }

         // --- 2. QUEUE LIST ---
         const MAX_DISPLAY = 6;
         const rawQList = queues[courtIdStr] || [];
         
         const validQList = rawQList.filter(pId => {
             const p = playersList.find(pl => pl.id === pId);
             const isPlaying = courtsList.some(c => c.currentMatch && c.currentMatch.includes(pId));
             return p && !p.isExpired && !isPlaying;
         });

         const visibleQueue = validQList.slice(0, MAX_DISPLAY);
         const hiddenCount = validQList.length - visibleQueue.length;

         const waitingPlayers = visibleQueue.map((pId, index) => {
             const p = playersList.find(pl => pl.id === pId);
             const rank = index + 1;
             const isTop4 = rank <= 4;
             const rankColor = isTop4 ? "text-amber-400" : "text-slate-500";
             const borderStyle = isTop4 ? "border-amber-500/30 shadow-[0_0_10px_rgba(245,158,11,0.05)] bg-slate-800/90" : "border-slate-700/50 bg-slate-800/40";
             
             return `
               <div class="p-3 sm:p-4 lg:p-5 rounded-xl border ${borderStyle} flex items-center gap-3 sm:gap-4 transition-all">
                 <div class="${rankColor} font-black text-xl sm:text-2xl lg:text-3xl w-8 sm:w-10 lg:w-12 text-right shrink-0">#${rank}</div>
                 <div class="flex-1 min-w-0 flex flex-col justify-center">
                    <div class="font-black text-slate-100 text-lg sm:text-xl lg:text-2xl leading-tight truncate tracking-wide uppercase">${p.name}</div>
                    <div class="mt-1 flex items-center gap-2">
                       <span class="${getBadgeClass(p.category)} text-[9px] lg:text-[10px] px-1.5 lg:px-2 py-0.5 rounded font-black uppercase tracking-wider">${p.category}</span>
                    </div>
                 </div>
               </div>
             `;
         }).join('');

         let hiddenIndicator = '';
         if (hiddenCount > 0) {
            hiddenIndicator = `
               <div class="p-2 lg:p-3 mt-1 rounded-xl border border-slate-700/50 border-dashed bg-slate-800/20 flex items-center justify-center">
                 <span class="text-slate-500 font-black text-xs lg:text-sm tracking-widest uppercase">+ ${hiddenCount} more waiting...</span>
               </div>
            `;
         }

         const emptyQueue = validQList.length === 0 ? `
            <div class="flex flex-col items-center justify-center h-full text-slate-600 p-6 lg:p-8 text-center flex-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 lg:w-16 lg:h-16 mb-2 lg:mb-4 opacity-30 mx-auto" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M4.285 12.433a.5.5 0 0 0 .683-.183A3.498 3.498 0 0 1 8 10.5c1.295 0 2.426.703 3.032 1.75a.5.5 0 0 0 .866-.5A4.498 4.498 0 0 0 8 9.5a4.5 4.5 0 0 0-3.898 2.25.5.5 0 0 0 .183.683zM7 6.5C7 7.328 6.552 8 6 8s-1-.672-1-1.5S5.448 5 6 5s1 .672 1 1.5zm4 0c0 .828-.448 1.5-1 1.5s-1-.672-1-1.5S9.448 5 10 5s1 .672 1 1.5z"/></svg>
              <h3 class="font-black text-sm lg:text-lg tracking-widest uppercase opacity-60">Line is Empty</h3>
            </div>` : '';

         // --- 3. COMBINE EVERYTHING ---
         return `
          <div class="bg-slate-800/80 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden flex flex-col lg:h-full min-h-0">
             ${courtCardHTML}
             
             <!-- Waiting List Header -->
             <div class="px-4 lg:px-5 py-2 lg:py-3 bg-slate-950/40 border-b border-slate-700 flex justify-between items-center flex-shrink-0 shadow-sm z-10">
                <span class="text-[10px] lg:text-sm font-black tracking-widest text-slate-400 uppercase">On Deck / Waiting</span>
                <span class="bg-slate-700 text-slate-300 text-xs lg:text-sm px-2 lg:px-3 py-0.5 rounded-full font-bold shadow-inner">${validQList.length}</span>
             </div>
             
             <!-- Queue Body -->
             <div class="flex-1 p-2 lg:p-3 space-y-2 lg:space-y-3 bg-slate-900/20 overflow-hidden flex flex-col">
                ${waitingPlayers || emptyQueue}
                ${hiddenIndicator}
             </div>
          </div>`;
      }).join('');

      document.getElementById('courts-grid').innerHTML = courtsHTML;
    }
  </script>
</body>
</html>
