<style>
:root{--bg:#f7f3ec;--card:#fff;--tx:#2a2118;--mut:#7a6f62;--bd:#e4ddd0;--ac:#f97316;--in:#b45309;--out:#dc2626;--hd:#efe9df;--cat:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 380px at 50% -120px,rgba(249,115,22,.16),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand img{height:46px;display:block}.sb{font-weight:800;font-style:italic;letter-spacing:.22em;font-size:11px;background:linear-gradient(90deg,#f97316,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}.sy{font-size:11px;color:var(--mut)}
.tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--bd)}
.tab{box-shadow:none!important;background:transparent!important;color:var(--mut)!important;padding:8px 14px}.tab.on{background:var(--ac)!important;color:#1a0f08!important}
main{max-width:820px;margin:0 auto;padding:14px 12px 40px}
.card{background:linear-gradient(#f97316,#f97316) top/100% 3px no-repeat,var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 14px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(90,60,30,.09)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
h2{margin:0;font-size:15px;font-style:italic;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin:0 0 12px}
input,select{font:inherit;color:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#1a0f08;font-weight:800;cursor:pointer}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:500;padding:7px 11px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 3px}
.row{display:flex;gap:8px}.row>*{flex:1}.note{font-size:12px;color:var(--mut);margin-top:6px}.empty{text-align:center;color:var(--mut);padding:20px}
.scroll{overflow-x:auto}.inn{color:var(--in)}.outn{color:var(--out)}.no{color:var(--out)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{background:var(--bg);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:10px 11px;cursor:pointer}
.chip.on{outline:2px solid var(--ac);background:#fff1e6}
.cn{font-weight:800;font-style:italic;text-transform:uppercase;color:var(--cat);font-size:21px;line-height:1.15}.cs{font-size:16px;font-weight:700;margin:3px 0}
.co{font-size:13px;font-weight:800;color:var(--in)}.co.no{color:var(--out)}.co small{font-size:11px;color:var(--mut);font-weight:600;margin-left:3px}
.cl{font-size:11.5px;color:var(--mut);margin-top:2px}.cl b{color:var(--tx)}
.otitle{font-size:30px;font-weight:800;font-style:italic;text-transform:uppercase;color:var(--cat);display:flex;gap:8px;align-items:center}
.avail{font-size:15px;font-weight:700;margin-top:2px}.meta{font-size:12px;color:var(--mut);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;border:1px solid currentColor}.pill.ok{color:var(--in)}.pill.low{color:var(--ac)}.pill.out{color:var(--out)}
.box{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.box.ib{border-left:4px solid var(--in);background:rgba(251,191,36,.06)}.box.ob{border-left:4px solid var(--out);background:rgba(248,113,113,.06)}
.bh{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}.ib .bh{color:var(--in)}.ob .bh{color:var(--out)}
.ir{display:flex;gap:8px}.ir select{width:120px;flex:none}.ir input{text-align:right;font-size:18px;font-weight:700}
.up{width:100%;padding:14px;font-size:16px;margin-top:14px}
.res{display:none;margin-top:12px;padding:11px 13px;border-radius:11px;font-size:13.5px;background:rgba(251,191,36,.1);border:1px solid var(--in);color:var(--in)}.res.show{display:block}.res.bad{background:rgba(248,113,113,.1);border-color:var(--out);color:var(--out)}
.warn{margin-top:8px;font-size:13px;font-weight:700;color:var(--out)}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fl select{width:auto;min-width:130px}
.irow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.irow:last-child{border:0}.iname{font-weight:800;font-style:italic;text-transform:uppercase;color:var(--cat);font-size:21px;display:flex;gap:6px;align-items:center}
.isub{font-size:12px;color:var(--mut);margin-top:3px}.itot{text-align:right;font-size:13px;white-space:nowrap}.itot div{margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);padding:8px 6px;background:var(--hd);border-bottom:2px solid var(--bd)}
td{padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}.num{text-align:right}th.num{text-align:right}
.led{border:1px solid var(--bd)}.led td,.led th{border-right:1px solid var(--bd)}.led td:last-child,.led th:last-child{border-right:0}
.led tbody tr:nth-child(even){background:rgba(0,0,0,.03)}.led tr[data-m]{cursor:pointer}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;white-space:nowrap}.sz{font-size:12px;color:var(--mut);font-weight:400}
.hist{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin:0 0 10px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,440px);padding:16px}dialog::backdrop{background:rgba(0,0,0,.6)}
.prev{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:9px 11px;font-size:13px;margin:10px 0;color:var(--mut)}
.rad{display:flex;gap:16px;margin:6px 0}.rad label{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx);font-size:14px}.rad input{width:auto}
#lk{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
</style></head><body>
<header class="top">
 <div class="brand"><img src="logo.png" alt="Stone Grill"><div class="sb">PANTRY STOCK</div><div class="sy" id="sync">Connecting…</div></div>
 <div class="tr"><nav class="tabs"><button class="tab on" data-t="main">Operations</button><button class="tab" data-t="log">Activity</button></nav>

</header>
<main>
<section id="p-main">
 <div class="card"><div class="ch"><h2>Stock by category</h2><button data-act="add">+ Add category</button></div><p class="hint">Tap a category to open it. Tap it again to close.</p><div class="strip" id="strip"></div></div>
 <div class="card" id="opsCard" hidden><div id="ops"></div><div class="res" id="res"></div></div>

</section>

</main>

<div id="lk"><div class="card" style="width:min(92vw,360px)"><div style="text-align:center"><img src="logo.png" alt="Stone Grill" style="height:80px"><div class="sb">PANTRY STOCK</div></div><div class="note" id="lkn">Loading…</div>
 <select id="ls" style="margin-top:10px"></select><input id="ln" placeholder="Your name" style="margin-top:10px" hidden><input id="lp" type="password" placeholder="PIN / password" autocomplete="off" style="margin-top:10px">
 <div class="note" id="lm"></div><button id="lg" style="width:100%;margin-top:8px">Unlock</button></div></div>

<dialog id="ds"><b>Staff</b><div id="sl" style="margin:8px 0"></div><label>Staff name</label><input id="sn"><label>PIN / password (4+ characters)</label><input id="sp" type="password" autocomplete="off">
 <div class="note" id="sm">Using an existing name resets that person’s PIN.</div><div class="row" style="margin-top:10px"><button class="g" id="sx" style="padding:12px">Close</button><button id="sa">Add / reset PIN</button></div></dialog>

<dialog id="dc"><b id="ct">Add category</b>
 <label>Category name</label><input id="cName" placeholder="e.g. PORK" autocomplete="off" style="text-transform:uppercase">
 <label>Primary tracking unit</label><div class="rad"><label><input type="radio" name="ut" value="weight" checked> Weight (kg)</label><label><input type="radio" name="ut" value="piece"> Pieces</label></div>
 <div class="row"><div><label>Grams per order</label><input id="cOrder" type="number" min="1" step="any" inputmode="decimal" placeholder="e.g. 200"></div><div><label>Grams per piece</label><input id="cPiece" type="number" min="1" step="any" inputmode="decimal" placeholder="e.g. 400"></div></div>
 <div class="prev" id="cprev">Enter grams per order and/or per piece.</div>
 <div class="row"><div><label>Low-stock alert (orders)</label><input id="cLow" type="number" min="0" value="5"></div><div id="ow"><label id="ol">Opening stock (kg)</label><input id="cOpen" type="number" min="0" step="any" value="0" inputmode="decimal"></div></div>
 <div class="note" id="cm"></div>
 <div class="row" style="margin-top:12px"><button class="g" id="cc" style="padding:12px">Cancel</button><button id="cs">Save category</button></div>
 <button class="g" id="cdel" hidden style="width:100%;margin-top:14px;color:var(--out);border-color:var(--out)">🗑 Delete this category</button></dialog>

<script>
/* Supabase connection (table: records). Leave url/key empty to store data on this device only.
   Anyone with the site link + key can read/write; PINs are a simple gate, not strong security. */
const CFG={url:'https://btnyktfthbarulnhetqy.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0bnlrdGZ0aGJhcnVsbmhldHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NjcwOTEsImV4cCI6MjExMDE0MzA5MX0.1u2FuPEPy7wWILCeApwlWBBiV1zeh17hgO72gDfKiRI'};
const DB=(()=>{const cache={},subs={};let ready=!CFG.url;
 const H=CFG.key?{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'}:{};
 const R=CFG.url.replace(/\/$/,'')+'/rest/v1/records';
 const emit=c=>{if(!ready)return;(subs[c]||[]).forEach(f=>f({docs:Object.entries(cache[c]||{}).map(([id,d])=>({id,data:()=>d}))}))};
 const saveLocal=()=>{try{localStorage.setItem('pantry-local',JSON.stringify(cache))}catch(e){}};
 async function pull(){if(!CFG.url)return;try{const r=await fetch(R+'?select=coll,id,data',{headers:H});const rows=await r.json();if(!Array.isArray(rows))return;
  const n={};rows.forEach(x=>{(n[x.coll]=n[x.coll]||{})[x.id]=x.data});
  new Set([...Object.keys(n),...Object.keys(cache)]).forEach(c=>{cache[c]=n[c]||{}});ready=true;Object.keys(subs).forEach(emit)}catch(e){}}
 if(!CFG.url){try{Object.assign(cache,JSON.parse(localStorage.getItem('pantry-local')||'{}'))}catch(e){}}else{pull();setInterval(pull,5000)}
 async function put(c,id,d,merge){const nd=merge?{...(cache[c]||{})[id],...d}:d;(cache[c]=cache[c]||{})[id]=nd;emit(c);
  if(!CFG.url){saveLocal();return}
  const r=await fetch(R,{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify({coll:c,id,data:nd})});if(!r.ok)throw new Error('Save failed ('+r.status+')')}
 async function del(c,id){if(cache[c])delete cache[c][id];emit(c);if(!CFG.url){saveLocal();return}
  const r=await fetch(R+'?coll=eq.'+c+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});if(!r.ok)throw new Error('Delete failed ('+r.status+')')}
 const coll=c=>({doc:id=>{id=id||crypto.randomUUID();return{set:d=>put(c,id,d,false),update:d=>put(c,id,d,true),delete:()=>del(c,id)}},onSnapshot:cb=>{(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>emit(c),0);return()=>{}}});
 return{collection:coll,doc:p=>{const[c,i]=p.split('/');return coll(c).doc(i)}}})();
const claude={use:async n=>n==='db'?DB:{canEdit:()=>true}};
</script>
<script>
const $=id=>document.getElementById(id);
let cats=[],moves=[],staff=[],db=null,me=null,sel='',editId=null,dirty=false,flt='',lim=30,idle=null,fails=0,until=0;const exp=new Set();
const fmt=n=>String(Math.round(n*1000)/1000);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>toDate(Date.now()),mDate=m=>m.date||toDate(m.ts);
const fdate=ds=>{if(!ds)return'—';if(ds===today())return'Today';const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})};
const tm=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const mkTs=()=>{if(!dirty||!$('dd'))return Date.now();const n=new Date(),[y,m,d]=($('dd').value||today()).split('-').map(Number),[h,mi]=($('dtm').value||'').split(':').map(Number);return new Date(y,m-1,d,isNaN(h)?n.getHours():h,isNaN(mi)?n.getMinutes():mi,n.getSeconds()).getTime()};
const cat=id=>cats.find(c=>c.id===id),byName=(a,b)=>a.name.localeCompare(b.name);
const stock=c=>moves.filter(m=>m.catId===c.id).reduce((a,m)=>a+m.g,0);
const tin=c=>moves.filter(m=>m.catId===c.id&&m.g>0).reduce((a,m)=>a+m.g,0),tout=c=>-moves.filter(m=>m.catId===c.id&&m.g<0).reduce((a,m)=>a+m.g,0);
const ordersOf=c=>{const s=Math.max(0,stock(c));return c.gpo>0?Math.floor(s/c.gpo+1e-9):(c.gpp>0?Math.floor(s/c.gpp+1e-9):0)};
const sTxt=(c,g,h)=>{if(c.unitType!=='weight')return Math.floor(g/(c.gpp||1)+1e-9)+' pcs';if(g<1000)return fmt(g)+' g';const k=Math.round(g)/1000,fr=!Number.isInteger(k),e=Math.round(g).toLocaleString()+' g';return fmt(k)+' kg'+(fr?(h?' <span class="sz">('+e+')</span>':' ('+e+')'):'')};
const kgl=q=>fmt(q)+' kg'+(Number.isInteger(Math.round(q*1000)/1000)?'':' ('+Math.round(q*1000).toLocaleString()+' g)');
const lb=s=>esc(s).replace(/ \((.*)\)$/,'<div class="sz" style="font-weight:400">$1</div>');
const last=(c,pos)=>moves.filter(m=>m.catId===c.id&&(pos?m.g>0:m.g<0)).sort((a,b)=>mDate(b).localeCompare(mDate(a))||b.ts-a.ts)[0];
const canOut=()=>!!(me&&(me.admin||me.out));
const pcls=c=>{const n=ordersOf(c);return n<=0?'out':n<=(c.low??5)?'low':'ok'};
const lastTxt=m=>m?'<b>'+fdate(mDate(m))+'</b> '+tm(m.ts):'—';
function res(h,bad){const b=$('res');b.innerHTML=h;b.classList.toggle('bad',!!bad);b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),6000)}
async function write(f){if(!me){lockUI();return}if(!db){alert('Storage unavailable.');return}try{await f()}catch(e){alert('Could not save: '+(e&&e.message||'error'))}}

function render(){renderStrip();renderOps();renderInv();renderAct();
 const names=cats.slice().sort(byName);$('flt').innerHTML='<option value="">All categories</option>'+names.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('flt').value=cats.some(c=>c.id===flt)?flt:'';}
function renderStrip(){$('strip').innerHTML=cats.slice().sort(byName).map(c=>{const n=ordersOf(c);
 return `<div class="chip${c.id===sel?' on':''}" data-id="${c.id}"><div class="cn">${esc(c.name)}</div><div class="cs">${sTxt(c,Math.max(0,stock(c)),1)}</div><div class="co ${n<=0?'no':''}">${n}<small>${c.unitType==='weight'?'orders':'pcs'}</small></div><div class="cl"><span class="inn">▲ IN</span> ${lastTxt(last(c,1))}</div><div class="cl"><span class="outn">▼ OUT</span> ${lastTxt(last(c,0))}</div></div>`}).join('')||'<div class="empty" style="grid-column:1/-1">No categories yet.</div>'}

function renderOps(){const box=$('ops');
 if(!cat(sel))sel='';$('opsCard').hidden=!sel;if(!sel){box.innerHTML='';box.dataset.c='';return}
 const c=cat(sel),n=ordersOf(c),keep=$('iq')&&box.dataset.c===c.id?{iq:$('iq').value,im:$('im').value,oq:$('oq').value,om:$('om').value,dd:$('dd').value,dtm:$('dtm').value}:null;
 const lo=!canOut(),meta=[c.gpo>0?fmt(c.gpo)+' g/order':'',c.gpp>0?fmt(c.gpp)+' g/pc':''].filter(Boolean).join(' · ');
 let io=(c.gpp>0?`<option value="piece">Pieces</option>`:'')+`<option value="kg">Kilos (kg)</option><option value="grams">Grams (g)</option>`;
 let oo=(c.gpo>0?`<option value="order">Orders</option>`:'')+(c.gpp>0?`<option value="piece">Pieces</option>`:'')+`<option value="kg">Kilos (kg)</option><option value="grams">Grams (g)</option>`;
 box.dataset.c=c.id;
 box.innerHTML=`<div class="otitle">${esc(c.name)}<button class="g" data-act="edit" data-id="${c.id}">✎</button><button class="g" data-act="close" style="margin-left:auto">✕ Close</button></div>
 <div class="avail">${sTxt(c,Math.max(0,stock(c)),1)} available</div>
 <div class="meta"><span class="pill ${pcls(c)}">${n} ${c.unitType==='weight'?'orders':'pcs'} available</span><span>${meta}</span></div>
 <div class="cl" style="margin-top:6px"><span class="inn">▲ LAST IN</span> ${lastTxt(last(c,1))} &nbsp; <span class="outn">▼ LAST OUT</span> ${lastTxt(last(c,0))}</div>
 <div class="box ib"><div class="bh">⬇ Stock in</div><div class="ir"><select id="im">${io}</select><input id="iq" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div></div>
 <div class="box ob"><div class="bh">⬆ Stock out ${lo?'🔒 (admin only)':''}</div><div class="ir"><select id="om" ${lo?'disabled':''}>${oo}</select><input id="oq" type="number" min="0" step="any" inputmode="decimal" placeholder="0" ${lo?'disabled':''}></div></div>
 <div class="row"><div><label>Date</label><input id="dd" type="date"></div><div><label>Time</label><input id="dtm" type="time"></div></div>
 <div class="note" id="kh" style="font-weight:700;color:var(--in)"></div><div class="note" id="dnote"></div><div class="warn" id="ow2"></div>
 <button class="up" id="bu">Update ${esc(c.name)}</button>`;
 $('im').value=keep?keep.im:(c.unitType==='piece'&&c.gpp>0?'piece':'kg');$('om').value=keep?keep.om:(c.gpo>0?'order':(c.gpp>0?'piece':'kg'));
 if(keep){$('iq').value=keep.iq;$('oq').value=keep.oq}
 $('dd').max=today();if(dirty&&keep){$('dd').value=keep.dd;$('dtm').value=keep.dtm}else{$('dd').value=today();$('dtm').value=new Date().toTimeString().slice(0,5)}
 note();warn();kh()}
function kh(){const t=[];[['im','iq'],['om','oq']].forEach(([m,q])=>{const v=+$(q).value;if($(m).value==='kg'&&v>0&&!Number.isInteger(Math.round(v*1000)/1000))t.push(fmt(v)+' kg = '+Math.round(v*1000).toLocaleString()+' g')});$('kh').textContent=t.join(' · ')}
function note(){$('dnote').textContent=dirty?'Late entry: using the date & time you set.':'Date & time are set automatically when you save. Tap to change for a late entry.'}
function warn(){const c=cat(sel);if(!c||!$('dd'))return;const dv=$('dd').value||today(),e=moves.filter(m=>m.catId===c.id&&mDate(m)===dv&&m.type!=='new');
 $('ow2').textContent=e.length?'⚠ Already entered for '+fdate(dv)+': '+e.map(m=>(m.g>0?'IN ':'OUT ')+m.label).join(', '):''}

async function apply(){const c=cat(sel);if(!c)return;if(!me){lockUI();return}
 const iq=+$('iq').value||0,im=$('im').value,oq=+$('oq').value||0,om=$('om').value;
 if(oq>0&&!canOut()){res('Stock out is locked. Ask the admin.',1);return}
 let ig=0,il='',og=0,ol='';
 if(iq>0){if(im==='kg'){ig=iq*1000;il=kgl(iq)}else if(im==='grams'){ig=iq;il=fmt(iq)+' g'}else if(c.gpp>0){ig=iq*c.gpp;il=fmt(iq)+' pcs'}}
 if(oq>0){if(om==='order'&&c.gpo>0){og=oq*c.gpo;ol=fmt(oq)+' orders'}else if(om==='kg'){og=oq*1000;ol=kgl(oq)}else if(om==='grams'){og=oq;ol=fmt(oq)+' g'}else if(om==='piece'&&c.gpp>0){og=oq*c.gpp;ol=fmt(oq)+' pcs'}}
 if(!ig&&!og){res('Enter a quantity to stock in or out.',1);return}
 if(og>stock(c)+ig+1e-9){res('⚠ Not enough stock. Only '+sTxt(c,Math.max(0,stock(c)))+' available.',1);return}
 const ts=mkTs(),date=toDate(ts),by=me.name,w=[];
 if(ig)w.push({catId:c.id,catName:c.name,type:'in',g:ig,label:il,by,ts,date});if(og)w.push({catId:c.id,catName:c.name,type:'out',g:-og,label:ol,by,ts,date});
 await write(async()=>{for(const m of w)await db.collection('moves').doc().set(m)});
 dirty=false;$('iq').value='';$('oq').value='';
 res('✔ <b>'+esc(c.name)+'</b> updated: '+[ig?'added '+il:'',og?'deducted '+ol:''].filter(Boolean).join(' & ')+'.')}

function renderInv(){const list=cats.filter(c=>!flt||c.id===flt).sort(byName);
 $('inv').innerHTML=list.map(c=>{const n=ordersOf(c),ex=exp.has(c.id),l=moves.filter(m=>m.catId===c.id).sort((a,b)=>mDate(a).localeCompare(mDate(b))||a.ts-b.ts);
  let h='';if(ex){let bal=0;const rows=l.map(m=>{bal+=m.g;return{m,bal}}).reverse().slice(0,25);
   h=`<div class="hist"><div class="scroll"><table class="led"><thead><tr><th>Date / time</th><th>Type</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th></tr></thead><tbody>${rows.map(({m,bal})=>`<tr data-m="${m.id}"><td>${fdate(mDate(m))}<div class="sz">${tm(m.ts)}</div></td><td>${m.type==='new'?'Opening':m.type==='in'?'Stock in':'Sold'}</td><td class="num mono inn">${m.g>0?lb(m.label):''}</td><td class="num mono outn">${m.g<0?lb(m.label):''}</td><td class="num mono">${sTxt(c,Math.max(0,bal),1)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No movements.</td></tr>'}</tbody></table></div>${me&&me.admin?'<div class="note">Admin: tap a row to correct or delete it.</div>':''}</div>`}
  return `<div class="irow" data-id="${c.id}"><div><div class="iname">${ex?'▾':'▸'} ${esc(c.name)} <button class="g" data-act="edit" data-id="${c.id}">✎</button></div><div class="isub"><b style="color:var(--tx);font-size:14px">${sTxt(c,Math.max(0,stock(c)),1)}</b> total · <span class="pill ${pcls(c)}">${n} ${c.unitType==='weight'?'order':'pc'}${n===1?'':'s'}</span></div><div class="isub">${[c.gpo>0?fmt(c.gpo)+' g/order':'',c.gpp>0?fmt(c.gpp)+' g/pc':''].filter(Boolean).join(' · ')}</div></div>
  <div class="itot"><div class="inn">In: ${sTxt(c,tin(c),1)}</div><div class="outn">Out: ${sTxt(c,tout(c),1)}</div></div></div>${h}`}).join('')||'<div class="empty">No categories yet.</div>'}

function renderAct(){const all=moves.slice().sort((a,b)=>mDate(b).localeCompare(mDate(a))||b.ts-a.ts),L=all.slice(0,lim);$('more').hidden=all.length<=lim;$('anote').textContent=(me&&me.admin)?'Admin: tap an entry to correct or delete it.':'';
 $('act').innerHTML=L.length?`<table class="led"><thead><tr><th>Date / what</th><th class="num">In (+)</th><th class="num">Out (−)</th></tr></thead><tbody>${L.map(m=>`<tr data-m="${m.id}"><td><b>${esc(m.catName)}</b> <span class="sz">${m.type==='new'?'opening':''}</span><div class="sz"><b style="color:var(--tx)">${fdate(mDate(m))}</b> · ${tm(m.ts)} · ${esc(m.by||'—')}</div></td><td class="num mono inn">${m.g>0?lb(m.label):''}</td><td class="num mono outn">${m.g<0?lb(m.label):''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No activity yet.</div>'}

function fixMove(id){if(!(me&&me.admin))return;const m=moves.find(x=>x.id===id),c=m&&cat(m.catId);if(!m||!c)return;
 const p=/^([\d.]+)\s*(\S+)/.exec(m.label||'');if(!p){alert('Cannot edit this entry.');return}
 const u=p[2].toLowerCase(),f=u==='kg'?1000:u==='g'?1:u.startsWith('pc')?c.gpp:u.startsWith('order')?c.gpo:0;if(!(f>0)){alert('Cannot edit this entry.');return}
 const v=prompt('Correct amount ('+p[2]+')\nEntry: '+m.catName+' · '+m.label+' · '+fdate(mDate(m))+'\n\nType 0 to DELETE this entry.',p[1]);if(v===null)return;const n=parseFloat(v);if(isNaN(n)||n<0)return;
 if(n===0){if(confirm('Delete this entry? The stock will change back.'))write(()=>db.doc('moves/'+id).delete());return}
 write(()=>db.doc('moves/'+id).update({g:(m.g<0?-1:1)*n*f,label:u==='kg'?kgl(n):fmt(n)+' '+p[2]}))}

/* ---- category modal ---- */
function openCat(c){editId=c?c.id:null;$('ct').textContent=c?'Edit category':'Add category';$('cName').value=c?c.name:'';
 document.querySelector(`input[name=ut][value=${c?c.unitType:'weight'}]`).checked=true;$('cOrder').value=c&&c.gpo?c.gpo:'';$('cPiece').value=c&&c.gpp?c.gpp:'';$('cLow').value=c?(c.low??5):5;$('cOpen').value=0;
 $('ow').hidden=!!c;$('cdel').hidden=!(c&&me&&me.admin);$('cm').textContent='';cprev();$('dc').showModal()}
const cu=()=>document.querySelector('input[name=ut]:checked').value;
function cprev(){const o=+$('cOrder').value,p=+$('cPiece').value;let h='';if(o>0)h+='1 kg = '+Math.floor(1000/o)+' orders of '+fmt(o)+' g<br>';if(p>0)h+='1 kg = '+Math.floor(1000/p)+' pieces of '+fmt(p)+' g';$('cprev').innerHTML=h||'Enter grams per order and/or per piece.';$('ol').textContent=cu()==='weight'?'Opening stock (kg)':'Opening stock (pieces)'}
$('cOrder').oninput=$('cPiece').oninput=cprev;document.querySelectorAll('input[name=ut]').forEach(r=>r.onchange=cprev);$('cc').onclick=()=>$('dc').close();
$('cs').onclick=async()=>{const name=$('cName').value.trim().toUpperCase(),ut=cu(),o=+$('cOrder').value||0,p=+$('cPiece').value||0,low=Math.max(0,parseInt($('cLow').value)||0),op=+$('cOpen').value||0;
 if(!name){$('cm').textContent='Enter a category name.';return}if(o<=0&&p<=0){$('cm').textContent='Enter grams per order or grams per piece.';return}if(ut==='piece'&&p<=0){$('cm').textContent='Pieces tracking needs grams per piece.';return}
 if(cats.some(c=>c.id!==editId&&c.name.toUpperCase()===name)){$('cm').textContent='That category already exists.';return}
 const d={name,unitType:ut,gpo:o,gpp:p,low};
 if(editId){await write(()=>db.doc('cats/'+editId).update(d))}
 else{const id=crypto.randomUUID();await write(async()=>{await db.doc('cats/'+id).set({...d,ts:Date.now()});if(op>0){const g=ut==='weight'?op*1000:op*p;await db.collection('moves').doc().set({catId:id,catName:name,type:'new',g,label:ut==='weight'?kgl(op):fmt(op)+' pcs',by:me?me.name:'',ts:Date.now(),date:today()})}})}
 $('dc').close()};
$('cdel').onclick=()=>{const c=cat(editId);if(c&&confirm('Delete category '+c.name+' and all its history?')){const ms=moves.filter(m=>m.catId===c.id);write(async()=>{for(const m of ms)await db.doc('moves/'+m.id).delete();await db.doc('cats/'+c.id).delete()});$('dc').close()}};

/* ---- events ---- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));$('p-main').hidden=t.dataset.t!=='main';$('p-log').hidden=t.dataset.t!=='log';scrollTo(0,0)});
document.body.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='add')openCat(null);else if(a.dataset.act==='edit'){e.stopPropagation();openCat(cat(a.dataset.id))}else if(a.dataset.act==='close'){sel='';dirty=false;renderStrip();renderOps()}},true);
$('strip').onclick=e=>{const c=e.target.closest('.chip');if(c){sel=sel===c.dataset.id?'':c.dataset.id;dirty=false;flt='';renderStrip();renderOps();renderInv();if(sel)$('opsCard').scrollIntoView({behavior:'smooth',block:'start'})}};
$('ops').addEventListener('click',e=>{if(e.target.id==='bu')apply()});
$('ops').addEventListener('change',e=>{if(['im','om'].includes(e.target.id))kh()});
$('ops').addEventListener('input',e=>{if(['iq','oq'].includes(e.target.id))kh();if(e.target.id==='dd'||e.target.id==='dtm'){dirty=true;note();warn()}});
$('flt').onchange=()=>{flt=$('flt').value;renderInv()};
$('inv').onclick=e=>{if(e.target.closest('[data-act]'))return;const r=e.target.closest('tr[data-m]');if(r){fixMove(r.dataset.m);return}const ir=e.target.closest('.irow');if(ir){const id=ir.dataset.id;exp.has(id)?exp.delete(id):exp.add(id);renderInv()}};
$('act').onclick=e=>{const r=e.target.closest('tr[data-m]');if(r)fixMove(r.dataset.m)};
$('more').onclick=()=>{lim+=30;renderAct()};
setInterval(()=>{if(!dirty&&$('dd')){$('dd').value=today();$('dtm').value=new Date().toTimeString().slice(0,5);warn()}render()},60000);

/* ---- login / staff ---- */
async function hash(salt,pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function touch(){clearTimeout(idle);if(me)idle=setTimeout(()=>{me=null;lockUI()},600000)}document.addEventListener('pointerdown',touch);
function lockUI(){if(me)me=staff.find(s=>s.id===me.id)||null;$('lk').style.display=me?'none':'flex';
 if(me){$('who').textContent='🔒 '+me.name;$('stB').hidden=!me.admin;render();return}
 $('who').textContent='🔒 Lock';$('stB').hidden=true;const setup=!staff.length;$('ls').hidden=setup;$('ln').hidden=!setup;$('lg').textContent=setup?'Create admin account':'Unlock';
 $('lkn').textContent=setup?'First time: enter your name and choose a PIN for the admin account.':'Select your name and enter your PIN.';
 const v=$('ls').value;$('ls').innerHTML=staff.slice().sort(byName).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(v)$('ls').value=v}
$('lg').onclick=async()=>{const pin=$('lp').value;if(Date.now()<until){$('lm').textContent='Too many tries. Wait a moment.';return}if(pin.length<4){$('lm').textContent='PIN must be at least 4 characters.';return}
 if(!staff.length){const name=$('ln').value.trim();if(!name||!db){$('lm').textContent='Enter a name.';return}const salt=crypto.randomUUID();
  try{await db.collection('staff').doc().set({name,salt,hash:await hash(salt,pin),admin:true,out:true,ts:Date.now()});$('lp').value='';$('lm').textContent='Created. Select your name to unlock.'}catch(e){$('lm').textContent='Could not create.'}return}
 const s=staff.find(x=>x.id===$('ls').value);if(!s)return;
 if(await hash(s.salt,pin)===s.hash){me=s;fails=0;$('lp').value='';$('lm').textContent='';lockUI();touch()}else{if(++fails>=5){until=Date.now()+30000;fails=0}$('lm').textContent='Wrong PIN.'}};
$('lp').onkeydown=e=>{if(e.key==='Enter')$('lg').click()};$('who').onclick=()=>{me=null;lockUI()};
$('stB').onclick=()=>{renderStaff();$('ds').showModal()};$('sx').onclick=()=>$('ds').close();
function renderStaff(){$('sl').innerHTML=staff.slice().sort(byName).map(s=>`<div class="irow" style="cursor:default;align-items:center"><div>${esc(s.name)}${s.admin?' <span class="sz">admin</span>':''}</div><div>${s.admin?'':`<button class="g" onclick="togOut('${s.id}')">Stock out: ${s.out?'ON':'OFF'}</button> `}<button class="g" onclick="rmStaff('${s.id}')">Remove</button></div></div>`).join('')}
function togOut(id){const s=staff.find(x=>x.id===id);if(s)write(()=>db.doc('staff/'+id).update({out:!s.out}))}
function rmStaff(id){if(me&&id===me.id){alert('You can’t remove yourself.');return}if(confirm('Remove this staff member?'))write(()=>db.doc('staff/'+id).delete())}
$('sa').onclick=async()=>{const name=$('sn').value.trim(),pin=$('sp').value;if(!name||pin.length<4){$('sm').textContent='Enter a name and a PIN of 4+ characters.';return}
 const ex=staff.find(s=>s.name.toLowerCase()===name.toLowerCase()),salt=crypto.randomUUID(),h=await hash(salt,pin);
 await write(()=>ex?db.doc('staff/'+ex.id).update({salt,hash:h}):db.collection('staff').doc().set({name,salt,hash:h,out:false,admin:false,ts:Date.now()}));$('sn').value='';$('sp').value='';$('sm').textContent=ex?'PIN reset.':'Added.'};

/* ---- start ---- */
render();
(async()=>{const t=setTimeout(()=>{$('sync').textContent='Not connected'},10000);
 try{db=await claude.use('db')}catch(e){db=null}
 if(!db){clearTimeout(t);$('sync').textContent='Storage unavailable';return}
 let got=0;const done=()=>{if(++got>=3){clearTimeout(t);$('sync').textContent=(CFG.url?'● Live · shared':'● This device only')+' · v11'}};
 const sub=(n,f)=>db.collection(n).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));done()},()=>{$('sync').textContent='Sync error'});
 sub('cats',a=>{cats=a;render()});sub('moves',a=>{moves=a;render()});sub('staff',a=>{staff=a;lockUI();renderStaff()});
})();
</script></body></html>
