<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickleQ Sessions - Registration</title>
    <style>
        /* Modern CSS Variables based on your brand colors */
        :root {
            --primary-navy: #10253f; /* Dark navy from logo */
            --primary-green: #90c226; /* Lime green from logo */
            --bg-white: #ffffff;
            --text-dark: #333333;
            --border-light: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-white);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Dynamic Diagonal Background Accents based on your sample image */
        .bg-accents {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: 
                linear-gradient(135deg, var(--primary-navy) 0%, var(--primary-navy) 5%, transparent 5%, transparent 100%),
                linear-gradient(135deg, transparent 5%, var(--primary-green) 5%, var(--primary-green) 7%, transparent 7%, transparent 100%),
                linear-gradient(-45deg, var(--primary-navy) 0%, var(--primary-navy) 10%, transparent 10%, transparent 100%),
                linear-gradient(-45deg, transparent 10%, var(--primary-green) 10%, var(--primary-green) 12%, transparent 12%, transparent 100%);
            background-color: var(--bg-white);
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 5px solid var(--primary-green);
        }

        .header {
            background-color: var(--primary-navy);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: var(--primary-green);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border-light);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-navy);
            transition: 0.3s;
        }

        .tab:hover {
            background-color: #e9ecef;
        }

        .tab.active {
            background-color: white;
            border-bottom: 3px solid var(--primary-green);
        }

        /* Hide dashboard tab by default, shown only to admins */
        #tab-dashboard {
            display: none; 
        }

        .content {
            padding: 30px;
            display: none;
        }

        .content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-navy);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        button.btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: var(--primary-navy);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.btn:hover {
            background-color: #7da820;
        }

        .auth-section {
            text-align: center;
            padding: 20px;
            background-color: #f1f3f5;
            border-bottom: 1px solid var(--border-light);
        }

        .auth-section p {
            margin-bottom: 10px;
            font-size: 14px;
        }

        button.google-btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* Dashboard Styles */
        .player-card {
            background: #f8f9fa;
            border: 1px solid var(--border-light);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info h3 {
            margin: 0 0 5px 0;
            color: var(--primary-navy);
            font-size: 18px;
        }

        .player-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: #ffeeba; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .action-btns button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-approve { background: var(--primary-green); color: var(--primary-navy); }
        .btn-reject { background: #dc3545; color: white; }

    </style>
</head>
<body>

    <!-- Background Accents -->
    <div class="bg-accents"></div>

    <div class="container">
        <div class="header">
            <h1>PickleQ Sessions</h1>
            <p>Intermediate Level • October 16, 2026</p>
        </div>

        <div class="auth-section" id="auth-container">
            <p>Please sign in to register or view the dashboard.</p>
            <button class="google-btn" id="login-btn">Sign in with Google</button>
        </div>

        <div id="app-container" style="display: none;">
            <div class="tabs">
                <div class="tab active" id="tab-register" onclick="switchTab('register')">Registration</div>
                <div class="tab" id="tab-dashboard" onclick="switchTab('dashboard')">Admin Dashboard</div>
            </div>

            <!-- Registration Form -->
            <div class="content active" id="content-register">
                <h2 style="margin-bottom: 20px; color: var(--primary-navy);">Reserve Your Spot</h2>
                <form id="registration-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" required placeholder="Juan Dela Cruz">
                    </div>
                    <div class="form-group">
                        <label>Nickname</label>
                        <input type="text" id="nickname" required placeholder="Juan">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="mobileNumber" required placeholder="09XX XXX XXXX">
                    </div>
                    <button type="submit" class="btn">Submit Registration</button>
                </form>
                <div id="reg-message" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
            </div>

            <!-- Admin Dashboard -->
            <div class="content" id="content-dashboard">
                <h2 style="margin-bottom: 20px; color: var(--primary-navy);">Player Registrations</h2>
                <div id="player-list">
                    <!-- Players will be populated here by JavaScript -->
                    <p>Loading players...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Setup (Modular V9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDoc, doc, onSnapshot, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Your specific Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAF8wP1ICmt5nxl4yltsOuwGBTI4TAdjnI",
            authDomain: "courtside-pickle.firebaseapp.com",
            projectId: "courtside-pickle",
            storageBucket: "courtside-pickle.firebasestorage.app",
            messagingSenderId: "179366005104",
            appId: "1:179366005104:web:4686480ca55735385067b5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let isAdmin = false;

        // UI Elements
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const loginBtn = document.getElementById('login-btn');
        const tabDashboard = document.getElementById('tab-dashboard');
        const regForm = document.getElementById('registration-form');
        const regMessage = document.getElementById('reg-message');
        const playerList = document.getElementById('player-list');

        // Authentication State Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authContainer.innerHTML = `<p>Signed in as <b>${user.displayName || user.email}</b></p>`;
                appContainer.style.display = 'block';

                // Check if user is in the 'admins' collection
                try {
                    const adminDoc = await getDoc(doc(db, "admins", user.uid));
                    if (adminDoc.exists()) {
                        isAdmin = true;
                        tabDashboard.style.display = 'block'; // Show dashboard tab
                        loadDashboard(); // Start listening to data
                    }
                } catch (error) {
                    console.log("Not an admin or permission denied.");
                }
            } else {
                appContainer.style.display = 'none';
            }
        });

        // Google Sign In
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("Error signing in: " + error.message);
            });
        });

        // Registration Submission
        regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const submitBtn = regForm.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            try {
                await addDoc(collection(db, "registrations"), {
                    fullName: document.getElementById('fullName').value,
                    nickname: document.getElementById('nickname').value,
                    mobileNumber: document.getElementById('mobileNumber').value,
                    userId: currentUser.uid,
                    status: 'Pending',
                    timestamp: serverTimestamp()
                });

                regForm.reset();
                regMessage.style.color = "green";
                regMessage.innerText = "Registration submitted! Please wait for a confirmation text.";
            } catch (error) {
                regMessage.style.color = "red";
                regMessage.innerText = "Error submitting registration. Please try again.";
                console.error(error);
            }

            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Registration";
        });

        // Real-time Dashboard Loading (Admins Only)
        function loadDashboard() {
            const q = query(collection(db, "registrations"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                playerList.innerHTML = ''; // Clear current list
                
                if(snapshot.empty) {
                    playerList.innerHTML = '<p>No registrations yet.</p>';
                    return;
                }

                snapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const id = documentSnapshot.id;
                    
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <div class="player-info">
                            <h3>${data.fullName} ("${data.nickname}")</h3>
                            <p>📱 ${data.mobileNumber}</p>
                            <span class="status-badge status-${data.status.toLowerCase()}">${data.status}</span>
                        </div>
                        <div class="action-btns">
                            ${data.status === 'Pending' ? `
                                <button class="btn-approve" onclick="window.updateStatus('${id}', 'Approved')">Approve</button>
                                <button class="btn-reject" onclick="window.updateStatus('${id}', 'Rejected')">Reject</button>
                            ` : ''}
                        </div>
                    `;
                    playerList.appendChild(card);
                });
            }, (error) => {
                playerList.innerHTML = '<p style="color:red;">Error loading dashboard. Ensure you have admin rights.</p>';
            });
        }

        // Global function to handle status updates from inline HTML buttons
        window.updateStatus = async function(docId, newStatus) {
            if (!isAdmin) return;
            try {
                const regRef = doc(db, "registrations", docId);
                await updateDoc(regRef, {
                    status: newStatus
                });
            } catch (error) {
                alert("Error updating status: " + error.message);
            }
        };
    </script>

    <!-- Tab Switching Logic -->
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('content-' + tabId).classList.add('active');
        }
    </script>
</body>
</html>
