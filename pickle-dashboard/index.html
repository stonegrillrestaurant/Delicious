<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICKLE VENTURES INC - Management Dashboard</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Translates React JSX to browser JavaScript) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- Inline SVG Icons ---
        const IconLayoutDashboard = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        );
        const IconClock = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const IconUsers = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );
        const IconUserPlus = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" x2="20" y1="8" y2="14"/><line x1="23" x2="17" y1="11" y2="11"/></svg>
        );
        const IconTrendingUp = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        );
        const IconCalendar = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        );
        const IconShieldAlert = ({ size = 18, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        );
        const IconEdit = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        );

        // --- Constants ---
        const COURTS = [
            { id: 1, name: 'Court 1' },
            { id: 2, name: 'Court 2' },
            { id: 3, name: 'Court 3' },
            { id: 4, name: 'Court 4' },
            { id: 5, name: 'Court 5' },
            { id: 6, name: 'Court 6' },
        ];

        const TIME_SLOTS = [
            { id: '16:00', label: '4:00 PM', duration: 1.5 },
            { id: '17:30', label: '5:30 PM', duration: 1.5 },
            { id: '19:00', label: '7:00 PM', duration: 1.5 },
            { id: '20:30', label: '8:30 PM', duration: 1.5 },
        ];

        // Updated Pricing based on requirements
        const PRICE_PER_COURT_HOUR = 2500; // ₱2500 per hour
        const PRICE_OPEN_PLAY = 150;       // ₱150 per player

        function App() {
            const [view, setView] = useState('player'); // 'player' | 'admin'
            
            // "Database" State
            const [bookings, setBookings] = useState([]); // { courtId, timeSlot, type: 'private' | 'open_play' | 'maintenance', players: [] }
            const [openPlayQueues, setOpenPlayQueues] = useState({}); // { '16:00': ['Player A', 'Player B'] }

            // POS Form State
            const [posTimeSlot, setPosTimeSlot] = useState(TIME_SLOTS[0].id);
            const [posCourtId, setPosCourtId] = useState(COURTS[0].id);
            const [posType, setPosType] = useState('private');
            const [posPlayerName, setPosPlayerName] = useState('');

            // --- Core Logic Methods ---
            const getAvailableCourts = (timeSlot) => {
                const bookedCourtIds = bookings
                    .filter(b => b.timeSlot === timeSlot)
                    .map(b => b.courtId);
                return COURTS.filter(c => !bookedCourtIds.includes(c.id));
            };

            const handleBookPrivate = (timeSlot) => {
                const avail = getAvailableCourts(timeSlot);
                if (avail.length === 0) return alert('No courts available for this time.');
                
                const courtToBook = avail[0]; // Take first available
                setBookings(prev => [
                    ...prev, 
                    { courtId: courtToBook.id, timeSlot, type: 'private', players: ['Online User + 3'] }
                ]);
            };

            // Simulates the Redis atomic queue logic + State Machine
            const handleJoinOpenPlay = (timeSlot) => {
                setOpenPlayQueues(prev => {
                    const currentQueue = prev[timeSlot] || [];
                    const newPlayerName = `Player ${currentQueue.length + 1}`;
                    let updatedQueue = [...currentQueue, newPlayerName];

                    // GROUPING LOGIC: Check if we hit 4 players
                    if (updatedQueue.length >= 4) {
                        const availCourts = getAvailableCourts(timeSlot);
                        if (availCourts.length > 0) {
                            const courtToLock = availCourts[0];
                            setBookings(currBookings => [
                                ...currBookings,
                                { courtId: courtToLock.id, timeSlot, type: 'open_play', players: updatedQueue.slice(0, 4) }
                            ]);
                            updatedQueue = updatedQueue.slice(4);
                        }
                    }
                    return { ...prev, [timeSlot]: updatedQueue };
                });
            };

            const toggleMaintenance = (timeSlot, courtId) => {
                setBookings(prev => {
                    const existing = prev.find(b => b.timeSlot === timeSlot && b.courtId === courtId);
                    if (existing) {
                        if (existing.type === 'maintenance') {
                            return prev.filter(b => b !== existing);
                        }
                        return prev; // Don't overwrite actual bookings by accident
                    }
                    return [...prev, { courtId, timeSlot, type: 'maintenance', players: [] }];
                });
            };

            // POS Form Submission
            const handlePOSSubmit = (e) => {
                e.preventDefault();
                if (!posPlayerName.trim()) {
                    return alert("Please enter the player's name.");
                }

                const courtNum = Number(posCourtId);
                
                // Check if already booked
                const existing = bookings.find(b => b.timeSlot === posTimeSlot && b.courtId === courtNum);
                if (existing && existing.type !== 'maintenance') {
                    return alert(`Court ${courtNum} is already booked for this time!`);
                }

                // Remove maintenance block if it exists and we are forcing a booking
                const filteredBookings = bookings.filter(b => !(b.timeSlot === posTimeSlot && b.courtId === courtNum));

                setBookings([
                    ...filteredBookings, 
                    { 
                        courtId: courtNum, 
                        timeSlot: posTimeSlot, 
                        type: posType, 
                        players: [posPlayerName] 
                    }
                ]);

                alert(`Successfully booked Court ${courtNum} for ${posPlayerName}!`);
                setPosPlayerName(''); // clear input
            };

            // --- Admin Analytics (Calculated dynamically) ---
            const kpis = useMemo(() => {
                let revenue = 0;
                let playerHours = 0;
                let totalPossibleCourts = COURTS.length * TIME_SLOTS.length;
                let occupiedCourts = 0;

                bookings.forEach(b => {
                    const slot = TIME_SLOTS.find(s => s.id === b.timeSlot);
                    if (b.type === 'private') {
                        // ₱2500 per hr * 1.5 hrs = ₱3750
                        revenue += (PRICE_PER_COURT_HOUR * slot.duration);
                        playerHours += (4 * slot.duration); // Assume 4 players for private
                        occupiedCourts++;
                    } else if (b.type === 'open_play') {
                        // ₱150 per player * 4 players = ₱600
                        revenue += (PRICE_OPEN_PLAY * 4);
                        playerHours += (4 * slot.duration);
                        occupiedCourts++;
                    }
                });

                const occupancyRate = totalPossibleCourts > 0 ? Math.round((occupiedCourts / totalPossibleCourts) * 100) : 0;

                return { 
                    revenue: revenue.toLocaleString(), // Format with commas
                    playerHours, 
                    occupancyRate 
                };
            }, [bookings]);

            // --- Sub-Components ---
            const Header = () => (
                <header className="bg-emerald-900 text-white shadow-md sticky top-0 z-10">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            <div className="bg-emerald-500 p-1.5 rounded-full">
                                <IconLayoutDashboard size={20} className="text-white" />
                            </div>
                            <h1 className="font-bold text-xl tracking-tight">PICKLE VENTURES INC</h1>
                        </div>
                        <div className="flex bg-emerald-800 rounded-lg p-1">
                            <button 
                                onClick={() => setView('player')}
                                className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${view === 'player' ? 'bg-white text-emerald-900 shadow-sm' : 'text-emerald-100 hover:text-white'}`}
                            >
                                Player View
                            </button>
                            <button 
                                onClick={() => setView('admin')}
                                className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${view === 'admin' ? 'bg-white text-emerald-900 shadow-sm' : 'text-emerald-100 hover:text-white'}`}
                            >
                                POS / Admin
                            </button>
                        </div>
                    </div>
                </header>
            );

            const PlayerView = () => (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-900">Book a Session</h2>
                            <p className="text-gray-500">Select a time slot to reserve a private court or join Open Play.</p>
                        </div>
                        <div className="flex gap-4 text-sm">
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-emerald-500"></div> Available</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-amber-500"></div> Queueing</div>
                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-gray-300"></div> Full</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {TIME_SLOTS.map(slot => {
                            const availCourts = getAvailableCourts(slot.id);
                            const queue = openPlayQueues[slot.id] || [];
                            const isFull = availCourts.length === 0;

                            const privateTotal = (PRICE_PER_COURT_HOUR * slot.duration).toLocaleString();

                            return (
                                <div key={slot.id} className={`border rounded-xl p-5 shadow-sm transition-all ${isFull ? 'bg-gray-50 border-gray-200 opacity-80' : 'bg-white border-emerald-100'}`}>
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-2">
                                            <IconClock size={20} className={isFull ? 'text-gray-400' : 'text-emerald-600'} />
                                            <h3 className="text-lg font-bold text-gray-900">{slot.label}</h3>
                                            <span className="text-xs font-medium px-2 py-1 bg-gray-100 text-gray-600 rounded-md">1.5 hrs</span>
                                        </div>
                                        <div className="text-right">
                                            <div className={`text-sm font-bold ${availCourts.length > 0 ? 'text-emerald-600' : 'text-gray-500'}`}>
                                                {availCourts.length} Courts Avail.
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 mt-6">
                                        <button
                                            onClick={() => handleBookPrivate(slot.id)}
                                            disabled={isFull}
                                            className="flex flex-col items-center justify-center p-3 border rounded-lg hover:border-emerald-500 hover:bg-emerald-50 disabled:opacity-50 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors"
                                        >
                                            <IconUsers size={20} className="mb-2 text-gray-600" />
                                            <span className="font-semibold text-gray-900 text-center">Private Court</span>
                                            <span className="text-xs text-gray-500 text-center mt-1">₱{PRICE_PER_COURT_HOUR.toLocaleString()} / hr</span>
                                            <span className="text-xs font-bold text-emerald-700 mt-1">(₱{privateTotal} total)</span>
                                        </button>

                                        <button
                                            onClick={() => handleJoinOpenPlay(slot.id)}
                                            disabled={isFull && queue.length >= 4}
                                            className="relative flex flex-col items-center justify-center p-3 border rounded-lg hover:border-amber-500 hover:bg-amber-50 disabled:opacity-50 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors"
                                        >
                                            <IconUserPlus size={20} className="mb-2 text-amber-600" />
                                            <span className="font-semibold text-gray-900 text-center">Join Open Play</span>
                                            <span className="text-xs text-gray-500 text-center mt-1">₱{PRICE_OPEN_PLAY} / player</span>
                                            
                                            <div className={`absolute -top-3 -right-2 px-2 py-0.5 rounded-full text-xs font-bold border ${queue.length > 0 ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-gray-100 text-gray-500 border-gray-200'}`}>
                                                {queue.length}/4 Queue
                                            </div>
                                        </button>
                                    </div>

                                    {queue.length > 0 && (
                                        <div className="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-100">
                                            <p className="text-xs text-amber-800 font-medium mb-1 flex justify-between">
                                                <span>Active Queue (Locks at 4):</span>
                                                {queue.length > 4 && <span>Waitlist: {queue.length - 4}</span>}
                                            </p>
                                            <div className="flex flex-wrap gap-1">
                                                {queue.map((p, i) => (
                                                    <span key={i} className={`text-xs px-2 py-1 rounded-md ${i < 4 ? 'bg-amber-200 text-amber-900' : 'bg-gray-200 text-gray-600'}`}>
                                                        {p}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const AdminView = () => (
                <div className="space-y-8">
                    
                    {/* POS & Manual Booking Form */}
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div className="p-5 border-b border-gray-200 bg-gray-50 flex items-center gap-2">
                            <IconEdit size={20} className="text-emerald-700" />
                            <h3 className="text-lg font-bold text-gray-900">Point of Sale (POS) - Manual Booking</h3>
                        </div>
                        <form onSubmit={handlePOSSubmit} className="p-5">
                            <div className="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                                
                                <div>
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Time Slot</label>
                                    <select 
                                        value={posTimeSlot} 
                                        onChange={(e) => setPosTimeSlot(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                                    >
                                        {TIME_SLOTS.map(slot => (
                                            <option key={slot.id} value={slot.id}>{slot.label} (1.5h)</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Choose Court</label>
                                    <select 
                                        value={posCourtId} 
                                        onChange={(e) => setPosCourtId(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                                    >
                                        {COURTS.map(court => (
                                            <option key={court.id} value={court.id}>{court.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Booking Type</label>
                                    <select 
                                        value={posType} 
                                        onChange={(e) => setPosType(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                                    >
                                        <option value="private">Private Court (₱{PRICE_PER_COURT_HOUR}/hr)</option>
                                        <option value="open_play">Open Play (Manual Lock)</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Write Player Name / Notes</label>
                                    <input 
                                        type="text" 
                                        value={posPlayerName}
                                        onChange={(e) => setPosPlayerName(e.target.value)}
                                        placeholder="e.g. Walk-in: John Doe"
                                        className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                                    />
                                </div>

                                <div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg p-2.5 text-sm transition-colors"
                                    >
                                        Confirm Booking
                                    </button>
                                </div>

                            </div>
                        </form>
                    </div>

                    {/* KPIs */}
                    <div>
                        <h2 className="text-xl font-bold text-gray-900 mb-4">Today's Utilization Overview</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-green-100 text-green-700 rounded-lg"><IconTrendingUp size={24} /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium">Projected Revenue</p>
                                    <p className="text-2xl font-bold text-gray-900">₱{kpis.revenue}</p>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-blue-100 text-blue-700 rounded-lg"><IconUsers size={24} /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium">Total Player Hours</p>
                                    <p className="text-2xl font-bold text-gray-900">{kpis.playerHours} <span className="text-sm font-normal text-gray-500">hrs</span></p>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-purple-100 text-purple-700 rounded-lg"><IconCalendar size={24} /></div>
                                <div>
                                    <p className="text-sm text-gray-500 font-medium">Court Occupancy</p>
                                    <p className="text-2xl font-bold text-gray-900">{kpis.occupancyRate}%</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Heatmap Grid */}
                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div className="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                            <div>
                                <h3 className="text-lg font-bold text-gray-900">Court Heatmap & Control</h3>
                                <p className="text-sm text-gray-500">Click any empty slot to toggle Maintenance mode.</p>
                            </div>
                            <div className="flex gap-3 text-xs font-medium">
                                 <span className="flex items-center gap-1"><div className="w-3 h-3 bg-blue-100 border border-blue-300 rounded"></div> Private</span>
                                 <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-100 border border-emerald-300 rounded"></div> Open Play</span>
                                 <span className="flex items-center gap-1"><div className="w-3 h-3 bg-red-100 border border-red-300 rounded"></div> Maint.</span>
                            </div>
                        </div>
                        
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[600px]">
                                <thead>
                                    <tr>
                                        <th className="p-3 border-b border-r bg-gray-50 text-xs text-gray-500 font-semibold w-24">Court</th>
                                        {TIME_SLOTS.map(slot => (
                                            <th key={slot.id} className="p-3 border-b border-gray-200 bg-gray-50 text-xs text-gray-500 font-semibold text-center">
                                                {slot.label}
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {COURTS.map(court => (
                                        <tr key={court.id} className="border-b border-gray-100 last:border-0">
                                            <td className="p-3 border-r border-gray-200 font-medium text-sm text-gray-700 bg-gray-50">
                                                {court.name}
                                            </td>
                                            {TIME_SLOTS.map(slot => {
                                                const booking = bookings.find(b => b.courtId === court.id && b.timeSlot === slot.id);
                                                
                                                let cellClasses = "p-2 border-r border-gray-100 last:border-0 h-20 cursor-pointer hover:bg-gray-50 transition-colors";
                                                let content = null;

                                                if (booking) {
                                                    if (booking.type === 'private') {
                                                        cellClasses = "p-2 border-r border-white bg-blue-50 h-20 cursor-not-allowed";
                                                        content = (
                                                            <div className="flex flex-col h-full text-xs text-blue-800 font-medium border border-blue-200 bg-blue-100/50 p-1.5 rounded overflow-hidden">
                                                                <span className="font-bold border-b border-blue-200/50 pb-1 mb-1">Private (₱3,750)</span>
                                                                <span className="truncate">{booking.players[0]}</span>
                                                            </div>
                                                        );
                                                    } else if (booking.type === 'open_play') {
                                                        cellClasses = "p-2 border-r border-white bg-emerald-50 h-20 cursor-not-allowed";
                                                        content = (
                                                            <div className="flex flex-col h-full text-xs text-emerald-800 font-medium border border-emerald-200 bg-emerald-100/50 p-1.5 rounded overflow-hidden">
                                                                <span className="font-bold border-b border-emerald-200/50 pb-1 mb-1">Open Play (LOCKED)</span>
                                                                {booking.players.length === 1 ? <span className="truncate">{booking.players[0]}</span> : <span className="truncate">4 Players</span>}
                                                            </div>
                                                        );
                                                    } else if (booking.type === 'maintenance') {
                                                         cellClasses = "p-2 border-r border-white bg-red-50 h-20 cursor-pointer hover:bg-red-100";
                                                         content = <div className="flex flex-col items-center justify-center h-full text-red-500"><IconShieldAlert size={18}/><span className="text-[10px] font-bold mt-1">Maintenance</span></div>;
                                                    }
                                                } else {
                                                    content = <div className="w-full h-full text-transparent hover:text-gray-300 flex items-center justify-center text-xs font-medium">+ Block</div>;
                                                }

                                                return (
                                                    <td 
                                                        key={slot.id} 
                                                        className={cellClasses}
                                                        onClick={() => {
                                                            if (!booking || booking.type === 'maintenance') {
                                                                toggleMaintenance(slot.id, court.id);
                                                            }
                                                        }}
                                                    >
                                                        {content}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-gray-50 font-sans">
                    <Header />
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {view === 'player' ? <PlayerView /> : <AdminView />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
