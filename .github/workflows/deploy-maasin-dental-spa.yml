name: Deploy Maasin Dental Spa booking app

on:
  push:
    branches: [main]
    paths:
      - 'maasin-dental-spa/**'
      - '.github/workflows/deploy-maasin-dental-spa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maasin-dental-spa-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dental app
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            maasin-dental-spa
          sparse-checkout-cone-mode: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: maasin-dental-spa
        run: bun install

      - name: Type-check app
        working-directory: maasin-dental-spa
        run: bun run lint

      - name: Build static app
        working-directory: maasin-dental-spa
        run: bun run build

      - name: Publish app files to the Pages source folder
        run: |
          rm -rf maasin-dental-spa/assets
          cp -R maasin-dental-spa/dist/assets maasin-dental-spa/assets
          cp maasin-dental-spa/dist/index.template.html maasin-dental-spa/index.html
          rm -rf maasin-dental-spa/dist

      - name: Commit deployed app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maasin-dental-spa/index.html maasin-dental-spa/assets maasin-dental-spa/bun.lock
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Deploy Maasin Dental Spa booking app"
            git push origin HEAD:main
          fi
