<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pick all AD-Ventures | Multi-Court Management</title>
  
  <meta property="og:image" content="https://stonegrillresto.net/pickle-dashboard/og-image.png">
  <meta property="og:title" content="Pick all AD-Ventures | Pickleball Court">
  <meta property="og:description" content="Eza Ventures Inc. Pickleball Court & Sports Arena">
  
  <link rel="manifest" href="/pickle-dashboard/manifest.json">
  <meta name="theme-color" content="#065f46">
  <link rel="apple-touch-icon" href="/pickle-dashboard/pwa-icon.PNG">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .badge-beginner { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-pro { background-color: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    #qr-modal { transition: opacity 0.2s ease-in-out; }
    .modal-active { opacity: 1; pointer-events: auto; }
    .modal-hidden { opacity: 0; pointer-events: none; }
    
    /* Hide scrollbar for a clean TV display */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 shadow-xl py-4 px-6 flex justify-between items-center">
    <div>
      <div class="bg-amber-500 text-slate-950 font-black px-3 py-1 rounded-lg text-sm tracking-wider inline-block mb-1">LIVE QUEUE</div>
      <h1 class="text-2xl font-black tracking-wide text-white">PICK ALL AD-VENTURES</h1>
    </div>
    <div class="text-right">
      <div id="clock" class="text-3xl font-black text-emerald-400">00:00</div>
      <div id="sync-status" class="text-xs text-slate-400 font-bold uppercase mt-1">Syncing...</div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
    
    <!-- Active Courts Column -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5 flex flex-col">
      <h2 class="text-xl font-black text-white mb-4 border-b border-slate-700 pb-2">Currently Playing</h2>
      <div id="playing-list" class="flex-1 space-y-3 overflow-hidden">
        <!-- Playing data will inject here -->
      </div>
    </section>

    <!-- Waiting Queue Column -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5 flex flex-col">
      <h2 class="text-xl font-black text-white mb-4 border-b border-slate-700 pb-2">On Deck / Waiting</h2>
      <div class="overflow-hidden flex-1">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900 text-slate-400">
            <tr>
              <th class="p-3">Player Name</th>
              <th class="p-3">Category</th>
              <th class="p-3">Time In</th>
            </tr>
          </thead>
          <tbody id="waiting-list" class="divide-y divide-slate-700/50">
            <!-- Waiting data will inject here -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbxpieHosDgAPmVFS9gSMUT0Igq_qNRxGHY9IhS--9unwCAzg3jATKZEgKPDLV9Z-F3Vqg/exec";

    // Update the live clock on the TV
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Fetch live data from Google Sheets
    async function fetchLiveData() {
      const statusIndicator = document.getElementById('sync-status');
      statusIndicator.innerText = "Syncing...";
      statusIndicator.classList.replace('text-emerald-500', 'text-slate-400');

      try {
        const response = await fetch(DATABASE_URL);
        const players = await response.json();
        
        renderTVDisplay(players);

        statusIndicator.innerText = "Live / Synced";
        statusIndicator.classList.replace('text-slate-400', 'text-emerald-500');
      } catch (error) {
        console.error("Failed to fetch queue data:", error);
        statusIndicator.innerText = "Connection Lost";
        statusIndicator.classList.replace('text-emerald-500', 'text-red-500');
      }
    }

    function renderTVDisplay(players) {
      const playingContainer = document.getElementById('playing-list');
      const waitingContainer = document.getElementById('waiting-list');

      // Separate players into those playing vs waiting
      const playing = players.filter(p => p.Status === 'Playing');
      const waiting = players.filter(p => p.Status === 'Waiting');

      // 1. Render Active Players
      if (playing.length === 0) {
        playingContainer.innerHTML = `<div class="text-slate-500 italic p-4 text-center">Courts are open</div>`;
      } else {
        playingContainer.innerHTML = playing.map(p => `
          <div class="bg-slate-900 border border-slate-700 p-4 rounded-lg flex justify-between items-center">
            <div>
              <div class="font-black text-white text-lg">${p.Player_Name}</div>
              <div class="${p.Category === 'Beginner' ? 'text-emerald-400' : 'text-indigo-400'} text-xs font-bold uppercase mt-1">${p.Category}</div>
            </div>
            <div class="text-right">
              <div class="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1 rounded font-bold text-sm shadow-inner">${p.Assigned_Court}</div>
            </div>
          </div>
        `).join('');
      }

      // 2. Render Waiting Queue
      if (waiting.length === 0) {
        waitingContainer.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-500 italic">No players waiting</td></tr>`;
      } else {
        waitingContainer.innerHTML = waiting.map(p => `
          <tr class="bg-slate-800 hover:bg-slate-700/50 transition">
            <td class="p-3 font-bold text-white text-base">${p.Player_Name}</td>
            <td class="p-3"><span class="${p.Category === 'Beginner' ? 'badge-beginner' : 'badge-pro'} px-2 py-1 rounded text-xs font-bold uppercase">${p.Category}</span></td>
            <td class="p-3 text-slate-400 text-sm font-bold">${p.Time_In}</td>
          </tr>
        `).join('');
      }
    }

    // Initial fetch, then repeat every 5 seconds
    fetchLiveData();
    setInterval(fetchLiveData, 5000);
  </script>
</body>
</html>
