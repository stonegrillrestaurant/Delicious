<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pick all AD-Ventures | Live TV Display</title>
  
  <meta property="og:image" content="https://stonegrillresto.net/pickle-dashboard/og-image.png">
  <meta property="og:title" content="Pick all AD-Ventures | Pickleball Court">
  <meta property="og:description" content="Eza Ventures Inc. Pickleball Court & Sports Arena">
  
  <link rel="manifest" href="/pickle-dashboard/manifest.json">
  <meta name="theme-color" content="#065f46">
  <link rel="apple-touch-icon" href="/pickle-dashboard/pwa-icon.PNG">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .badge-beginner { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .badge-pro { background-color: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    
    /* Hide scrollbar for a clean TV display but allow scrolling */
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen overflow-hidden flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 shadow-xl py-3 px-6 flex justify-between items-center z-50 shrink-0">
    <div>
      <div class="bg-amber-500 text-slate-950 font-black px-3 py-1 rounded-lg text-sm tracking-wider inline-block mb-1 shadow-lg">LIVE QUEUE</div>
      <h1 class="text-3xl font-black tracking-wide text-white">PICK ALL AD-VENTURES</h1>
    </div>
    <div class="text-right">
      <div id="clock" class="text-4xl font-black text-emerald-400 drop-shadow-md">00:00</div>
      <div id="sync-status" class="text-sm text-slate-400 font-bold uppercase mt-1">Syncing...</div>
    </div>
  </header>

  <main class="flex-1 p-6 flex flex-col gap-6 overflow-hidden">
    
    <!-- Active Courts Grid (Top Row) -->
    <section class="bg-slate-800/80 rounded-2xl border border-slate-700 shadow-xl p-5 shrink-0">
      <h2 class="text-xl font-black text-white mb-4 flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        Currently Playing
      </h2>
      <div id="playing-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Court Cards will inject here -->
      </div>
    </section>

    <!-- Waiting Queue Table (Bottom Fill) -->
    <section class="bg-slate-800/80 rounded-2xl border border-slate-700 shadow-xl p-5 flex-1 flex flex-col overflow-hidden">
      <div class="flex justify-between items-end border-b border-slate-700 pb-3 mb-4 shrink-0">
        <h2 class="text-3xl font-black text-white tracking-wide">Waiting Line</h2>
        <span class="text-base font-bold text-slate-400 uppercase tracking-wider">Top 4 On Deck</span>
      </div>
      
      <div class="overflow-y-auto flex-1 rounded-xl bg-slate-900/50 border border-slate-700/50 shadow-inner">
        <table class="w-full text-left relative">
          <thead class="bg-slate-950/80 text-slate-400 sticky top-0 shadow-md z-10 backdrop-blur-sm">
            <tr class="text-lg uppercase tracking-wider">
              <th class="p-4 w-24 text-center">Rank</th>
              <th class="p-4">Player Name</th>
              <th class="p-4">Category</th>
              <th class="p-4 text-right pr-8">Time In</th>
            </tr>
          </thead>
          <tbody id="waiting-list" class="divide-y divide-slate-700/50">
            <!-- Waiting data will inject here -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbxpieHosDgAPmVFS9gSMUT0Igq_qNRxGHY9IhS--9unwCAzg3jATKZEgKPDLV9Z-F3Vqg/exec";

    // Update the live clock on the TV
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Fetch live data from Google Sheets
    async function fetchLiveData() {
      const statusIndicator = document.getElementById('sync-status');
      statusIndicator.innerText = "Syncing...";
      statusIndicator.classList.replace('text-emerald-500', 'text-slate-400');

      try {
        // Fetch bypasses cache to always get newest data
        const response = await fetch(DATABASE_URL, { cache: "no-store" });
        const players = await response.json();
        
        renderTVDisplay(players);

        statusIndicator.innerText = "Live / Synced";
        statusIndicator.classList.replace('text-slate-400', 'text-emerald-500');
        statusIndicator.classList.replace('text-red-500', 'text-emerald-500');
      } catch (error) {
        console.error("Failed to fetch queue data:", error);
        statusIndicator.innerText = "Connection Lost";
        statusIndicator.classList.replace('text-emerald-500', 'text-red-500');
        statusIndicator.classList.replace('text-slate-400', 'text-red-500');
      }
    }

    function renderTVDisplay(players) {
      const playingContainer = document.getElementById('playing-list');
      const waitingContainer = document.getElementById('waiting-list');

      const playing = players.filter(p => p.Status === 'Playing');
      const waiting = players.filter(p => p.Status === 'Waiting');

      // 1. Render Courts (4 Grid format like Admin)
      const courtNames = ["Court 1", "Court 2", "Court 3", "Court 4"];
      
      playingContainer.innerHTML = courtNames.map(courtName => {
        const matchPlayers = playing.filter(p => p.Assigned_Court === courtName);
        
        // Default Empty State
        let badgeHtml = `<span class="bg-slate-700 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase shadow-sm">OPEN</span>`;
        let contentHtml = `<div class="text-center text-sm text-slate-500 bg-slate-950/40 border-slate-800 italic rounded-lg border border-dashed py-4">Court Open</div>`;

        // Active Match State
        if (matchPlayers.length > 0) {
          const cat = matchPlayers[0].Category;
          badgeHtml = `<span class="${cat === 'Beginner' ? 'badge-beginner' : 'badge-pro'} text-[10px] font-bold px-2 py-0.5 rounded uppercase shadow-sm tracking-wider">${cat}</span>`;
          
          contentHtml = `
            <div class="grid grid-cols-2 gap-2 text-sm">
              <div class="bg-slate-800 border border-slate-700 text-slate-100 py-2 px-1.5 rounded-lg font-black text-center truncate shadow-inner">${matchPlayers[0]?.Player_Name || '---'}</div>
              <div class="bg-slate-800 border border-slate-700 text-slate-100 py-2 px-1.5 rounded-lg font-black text-center truncate shadow-inner">${matchPlayers[1]?.Player_Name || '---'}</div>
              <div class="bg-slate-800 border border-slate-700 text-slate-100 py-2 px-1.5 rounded-lg font-black text-center truncate shadow-inner">${matchPlayers[2]?.Player_Name || '---'}</div>
              <div class="bg-slate-800 border border-slate-700 text-slate-100 py-2 px-1.5 rounded-lg font-black text-center truncate shadow-inner">${matchPlayers[3]?.Player_Name || '---'}</div>
            </div>
          `;
        }

        return `
          <div class="border rounded-2xl p-4 bg-slate-900 border-slate-700 flex flex-col justify-between shadow-lg">
            <div class="flex justify-between items-center mb-4">
              <span class="font-black text-white text-lg tracking-wide">${courtName}</span>
              ${badgeHtml}
            </div>
            <div class="flex flex-col justify-center">
              ${contentHtml}
            </div>
          </div>
        `;
      }).join('');

      // 2. Render Massive Waiting Queue Table
      if (waiting.length === 0) {
        waitingContainer.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-500 text-2xl font-bold italic">No players currently waiting.</td></tr>`;
      } else {
        waitingContainer.innerHTML = waiting.map((p, index) => {
          const rank = index + 1;
          // Highlight top 4 players
          const isTop4 = rank <= 4;
          const rankBadge = isTop4 
            ? 'bg-amber-500/20 text-amber-400 border-2 border-amber-500/40 shadow-[0_0_10px_rgba(245,158,11,0.2)]' 
            : 'text-slate-400 bg-slate-800 border border-slate-700';
          
          return `
          <tr class="hover:bg-slate-700/40 transition-colors border-b border-slate-700/60 last:border-0">
            <td class="p-5 text-center">
              <span class="${rankBadge} px-4 py-1.5 rounded-lg font-black text-xl flex items-center justify-center w-14 mx-auto">
                #${rank}
              </span>
            </td>
            <td class="p-5 font-black text-white text-2xl md:text-3xl uppercase tracking-wider">${p.Player_Name}</td>
            <td class="p-5">
              <span class="${p.Category === 'Beginner' ? 'badge-beginner' : 'badge-pro'} px-3 py-1.5 rounded-lg text-sm font-bold uppercase tracking-wider shadow-sm">
                ${p.Category}
              </span>
            </td>
            <td class="p-5 text-slate-400 text-xl font-bold text-right pr-8 whitespace-nowrap">${p.Time_In}</td>
          </tr>
        `}).join('');
      }
    }

    // Start App
    fetchLiveData();
    setInterval(fetchLiveData, 5000); // Refreshes exactly every 5 seconds
  </script>
</body>
</html>
