<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick All AD-Ventures | TV Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* TV specific cleanups: hide scrollbars, prevent text selection */
    body { user-select: none; overflow: hidden; }
    ::-webkit-scrollbar { display: none; }
    
    /* Smooth fade in for data updates */
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

  <!-- TV HEADER -->
  <header class="bg-slate-900 border-b-4 border-emerald-500 shadow-2xl py-4 px-8 flex justify-between items-center z-10">
    <div class="flex items-center gap-4">
      <div class="bg-emerald-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xl tracking-widest uppercase shadow-lg shadow-emerald-500/20">Live</div>
      <div>
        <h1 class="text-3xl font-black tracking-widest text-white uppercase">Pick All AD-Ventures</h1>
        <p class="text-slate-400 font-bold text-sm tracking-widest">COURT & QUEUE STATUS</p>
      </div>
    </div>
    <div class="text-right">
      <div id="clock-time" class="text-4xl font-black text-white tracking-wider">00:00</div>
      <div id="clock-date" class="text-slate-400 font-bold text-sm tracking-widest uppercase">Date</div>
    </div>
  </header>

  <!-- TV MAIN CONTENT GRID -->
  <main class="flex-1 grid grid-cols-12 gap-6 p-6 overflow-hidden">
    
    <!-- LEFT: LIVE COURTS (Spans 7 columns) -->
    <section class="col-span-7 flex flex-col gap-4">
      <h2 class="text-2xl font-black text-slate-300 uppercase tracking-widest flex items-center gap-3">
        <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        Active Courts
      </h2>
      <div id="tv-courts" class="grid grid-cols-2 gap-4 flex-1">
        <!-- Courts injected here -->
        <div class="flex items-center justify-center h-full text-slate-500 text-xl font-bold animate-pulse">Loading Live Courts...</div>
      </div>
    </section>

    <!-- RIGHT: WAITING QUEUE (Spans 5 columns) -->
    <section class="col-span-5 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col relative overflow-hidden">
      <h2 class="text-2xl font-black text-slate-300 uppercase tracking-widest mb-6 flex items-center gap-3">
        <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Up Next (Queue)
      </h2>
      
      <div class="flex-1 overflow-hidden flex flex-col gap-6">
        
        <!-- Beginner Queue -->
        <div class="flex-1 flex flex-col">
          <div class="bg-emerald-900/30 border border-emerald-500/30 text-emerald-400 font-black px-4 py-2 rounded-t-xl text-lg uppercase tracking-wider">Beginner</div>
          <div id="tv-queue-beginner" class="bg-slate-950/50 border border-t-0 border-emerald-500/20 rounded-b-xl flex-1 p-4 flex flex-col gap-2">
            <!-- Queue injected here -->
          </div>
        </div>

        <!-- Professional Queue -->
        <div class="flex-1 flex flex-col">
          <div class="bg-indigo-900/30 border border-indigo-500/30 text-indigo-400 font-black px-4 py-2 rounded-t-xl text-lg uppercase tracking-wider">Professional</div>
          <div id="tv-queue-pro" class="bg-slate-950/50 border border-t-0 border-indigo-500/20 rounded-b-xl flex-1 p-4 flex flex-col gap-2">
            <!-- Queue injected here -->
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Disconnected Warning -->
  <div id="connection-warning" class="fixed bottom-0 left-0 w-full bg-red-600 text-white text-center py-2 font-bold tracking-widest hidden z-50">
    SYSTEM OFFLINE - RECONNECTING TO SERVER...
  </div>

  <script>
    // ==================================================
    // CONFIGURATION
    // ==================================================
    // Your specific Google Apps Script URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydJGXl1wH8znoVnR4ys1X0wX0X2rXo9zYfIZWCN3NGjXKInTyE6TDiKFPJnypzl8TX/exec";
    
    // How often the TV checks for new data (in milliseconds. 10000 = 10 seconds)
    const REFRESH_RATE = 10000; 

    // ==================================================
    // CLOCK LOGIC
    // ==================================================
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('clock-date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==================================================
    // FETCH & RENDER LOGIC
    // ==================================================
    async function fetchLiveData() {
      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error("Network not OK");
        
        const data = await response.json();
        renderTV(data);
        
        document.getElementById('connection-warning').classList.add('hidden');
      } catch (error) {
        console.error("Failed to fetch data:", error);
        document.getElementById('connection-warning').classList.remove('hidden');
      }
    }

    function renderTV(data) {
      const courtsContainer = document.getElementById('tv-courts');
      const bgqContainer = document.getElementById('tv-queue-beginner');
      const proqContainer = document.getElementById('tv-queue-pro');

      // Add fade effect for smooth transition
      courtsContainer.classList.remove('fade-in'); void courtsContainer.offsetWidth; courtsContainer.classList.add('fade-in');
      bgqContainer.classList.remove('fade-in'); void bgqContainer.offsetWidth; bgqContainer.classList.add('fade-in');
      proqContainer.classList.remove('fade-in'); void proqContainer.offsetWidth; proqContainer.classList.add('fade-in');

      // 1. RENDER COURTS
      let courtsHTML = "";
      if (data.courts) {
        data.courts.forEach(court => {
          let content = "";
          let bgColor = court.assignedCategory === 'Beginner' ? 'border-emerald-500/20 bg-emerald-950/10' : 'border-indigo-500/20 bg-indigo-950/10';
          let badgeColor = court.assignedCategory === 'Beginner' ? 'bg-emerald-500 text-slate-900' : 'bg-indigo-500 text-slate-900';

          if (court.isExclusive) {
            bgColor = 'border-amber-500/40 bg-amber-900/20';
            content = `
              <div class="flex-1 flex flex-col items-center justify-center text-center p-4">
                <span class="text-amber-500 font-black text-xl tracking-widest uppercase mb-2">Exclusive Rent</span>
                <span class="text-white font-black text-4xl">${court.Renter}</span>
                <span class="text-amber-500/80 font-bold text-lg mt-4 border border-amber-500/30 px-3 py-1 rounded-lg">Until ${court.timeOut}</span>
              </div>
            `;
          } else if (court.currentMatch) {
             // Map Player IDs to Names
             const players = court.currentMatch.map(id => {
                const p = data.players.find(x => x.id === id);
                return p ? p.name : "Unknown Player";
             });
             content = `
              <div class="flex-1 grid grid-cols-2 gap-4 p-4 content-center h-full">
                 ${players.map(name => `<div class="bg-slate-800/80 border border-slate-700 rounded-xl flex items-center justify-center p-4 text-center"><span class="text-white font-black text-2xl leading-tight line-clamp-2">${name}</span></div>`).join('')}
              </div>
             `;
          } else {
             content = `
              <div class="flex-1 flex items-center justify-center">
                <span class="text-slate-600 font-black text-4xl tracking-widest uppercase italic opacity-50">OPEN</span>
              </div>
             `;
          }

          courtsHTML += `
            <div class="border-2 ${bgColor} rounded-3xl flex flex-col overflow-hidden shadow-xl relative">
              <div class="px-6 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="text-2xl font-black text-white">${court.name}</h3>
                <span class="${badgeColor} px-3 py-1 rounded-lg text-sm font-black uppercase tracking-widest">${court.assignedCategory}</span>
              </div>
              ${content}
            </div>
          `;
        });
      }
      courtsContainer.innerHTML = courtsHTML;

      // 2. RENDER QUEUES
      const now = Date.now();
      
      const renderQueueList = (categoryArray, containerElement) => {
        if (!categoryArray || categoryArray.length === 0) {
          containerElement.innerHTML = `<div class="text-slate-600 font-bold text-xl italic text-center mt-4">Queue Empty</div>`;
          return;
        }

        // Get actual players and filter out expired ones
        let validPlayers = categoryArray
          .map(id => data.players.find(p => p.id === id))
          .filter(p => p && p.expireTimestamp > now);

        if(validPlayers.length === 0) {
            containerElement.innerHTML = `<div class="text-slate-600 font-bold text-xl italic text-center mt-4">Queue Empty</div>`;
            return;
        }

        // Show max 6 players so it doesn't overflow the TV screen
        const listToShow = validPlayers.slice(0, 6);
        let qHTML = listToShow.map((p, index) => `
          <div class="flex items-center gap-4 bg-slate-800/80 p-3 rounded-xl border border-slate-700">
            <div class="bg-slate-950 text-slate-400 font-black text-xl w-10 h-10 flex items-center justify-center rounded-lg border border-slate-700">
              ${index + 1}
            </div>
            <div class="text-white font-bold text-2xl truncate">${p.name}</div>
          </div>
        `).join('');

        if (validPlayers.length > 6) {
           qHTML += `<div class="text-center text-slate-500 font-bold mt-2 italic">+ ${validPlayers.length - 6} more waiting...</div>`;
        }

        containerElement.innerHTML = qHTML;
      };

      if (data.queues) {
        renderQueueList(data.queues.Beginner, bgqContainer);
        renderQueueList(data.queues.Professional, proqContainer);
      }
    }

    // Start fetching data immediately, then repeat based on REFRESH_RATE
    fetchLiveData();
    setInterval(fetchLiveData, REFRESH_RATE);

  </script>
</body>
</html>
