<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stone Grill — Price Editor</title>
<style>
:root{color-scheme:light;--red:#c93422;--ink:#202124;--muted:#65717c;--line:#e2e6ea;--bg:#f5f6f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}header{background:#c93422;color:white;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}header h1{font-size:1.15rem;margin:0}.shell{max-width:760px;margin:auto;padding:18px 14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 3px 12px #17212a0a}.hint,.status{color:var(--muted);font-size:.92rem}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:white;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.btn.secondary{background:white;color:#29313a;border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}.search{margin:10px 0 14px}.category{font-weight:750;margin:18px 0 8px}.item{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:center;border-top:1px solid #edf0f2;padding:10px 0}.item-name{font-weight:620}.price-input{min-width:0;text-align:right}.hidden{display:none!important}.notice{min-height:1.4em}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:8px}@media(max-width:480px){header{padding:12px}.shell{padding:12px 10px}.card{padding:14px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.item{grid-template-columns:minmax(0,1fr) 106px}}
</style></head><body>
<header><h1>Stone Grill · Menu price editor</h1><a class="btn secondary" href="/order/">Back to menu</a></header>
<main class="shell"><section id="signedOut" class="card"><h2>Sign in to edit prices</h2><p class="hint">Use your authorized Stone Grill Google staff account. The old page passcode is no longer needed.</p><button id="signIn" class="btn">Sign in with Google</button><p id="authNotice" class="status notice" role="status"></p></section>
<section id="editor" class="hidden"><div class="card"><div class="top"><div><strong id="account"></strong><div class="hint">Prices here update the menu for new orders.</div></div><div class="actions"><button id="save" class="btn" disabled>Save changes</button><button id="signOut" class="btn secondary">Sign out</button></div></div><input id="search" class="search" type="search" placeholder="Search menu items" aria-label="Search menu items"><p id="status" class="status notice" role="status">Loading menu…</p><div id="items"></div></div></section></main>
<script src="/order/firebase-config.js"></script><script type="module">
import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const app=getApps().length?getApps()[0]:initializeApp(globalThis.SG_FIREBASE_CONFIG),auth=getAuth(app),provider=new GoogleAuthProvider(),api=globalThis.SG_STAFF_CONFIG?.apiUrl;let menu=null,dirty=false,user=null;const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
async function request(action,extra={}){if(!api||!user)throw Error('Staff service is not configured.');const token=await user.getIdToken();const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,...extra})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw Error(data.error||'Request failed.');return data}
function render(){const q=$('search').value.trim().toLowerCase(),root=$('items');root.replaceChildren();for(const cat of menu.categories){const items=(menu.data[cat.id]||[]).filter(i=>i.name.toLowerCase().includes(q));if(!items.length)continue;const title=document.createElement('div');title.className='category';title.textContent=(cat.emoji?cat.emoji+' ':'')+cat.label;root.appendChild(title);for(const item of items){const row=document.createElement('label');row.className='item';const name=document.createElement('span');name.className='item-name';name.textContent=item.name;const input=document.createElement('input');input.className='price-input';input.type='number';input.min='0';input.max='1000000';input.step='1';input.inputMode='numeric';input.setAttribute('aria-label',item.name+' price in pesos');input.value=item.price;input.addEventListener('input',()=>{const price=Number(input.value);if(!Number.isSafeInteger(price)||price<0||price>1000000){input.setCustomValidity('Use a whole peso amount from 0 to 1,000,000.');$('save').disabled=true;return}input.setCustomValidity('');item.price=price;dirty=true;$('save').disabled=false;status('Unsaved price changes')});row.append(name,input);root.appendChild(row)}}}
$('signIn').onclick=async()=>{$('signIn').disabled=true;$('authNotice').textContent='Opening Google sign-in…';try{await signInWithPopup(auth,provider)}catch(e){$('authNotice').textContent=e.message||'Sign-in could not be completed.'}finally{$('signIn').disabled=false}};$('signOut').onclick=()=>signOut(auth);$('search').oninput=()=>menu&&render();
$('save').onclick=async()=>{if(!menu||!dirty)return;const bad=$('items').querySelector('input:invalid');if(bad){bad.focus();return}$('save').disabled=true;status('Saving…');try{const data=await request('saveMenu',{menu});menu=data.menu;dirty=false;render();status(data.message||'Prices saved.')}catch(e){status(e.message);$('save').disabled=false}};
onAuthStateChanged(auth,async current=>{user=current;$('signedOut').classList.toggle('hidden',!!current);$('editor').classList.toggle('hidden',!current);if(!current)return;$('account').textContent=current.displayName||current.email||'Signed in';status('Loading menu…');try{const data=await request('getMenu');menu=data.menu;render();status('Prices loaded.')}catch(e){menu=null;status(e.message.includes('Owner or admin')?'This account does not have price editor access. Ask the owner to assign an admin role.':e.message)}});
</script></body></html>
