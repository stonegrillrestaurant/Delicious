@media(min-width:600px){.op-summary .op-totals{grid-template-columns:repeat(5,minmax(0,1fr))}.op-total b{font-size:20px}.op-table{font-size:13px}.op-table th{font-size:12px}}
@media(min-width:900px){.report-breakdowns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}}

@media(min-width:640px){.report-filters{grid-template-columns:auto minmax(160px,240px) 1fr;align-items:center}}
</style>

<header>
 <div class="row"><div><h1>🏓 Venue Desk</h1><div class="sub" id="date"></div></div><button class="btn s g" onclick="switchStaff()">Switch employee</button></div>
 <div style="margin-top:6px"><button id="sync" class="btn s g" onclick="syncNow()">● Connecting…</button></div>
</header>

<script>
const OPEN_H=8,CLOSE_H=24,COURTS=6,H=3600000,GRACE_MIN=10,APP_VER="1.7"; // GRACE_MIN: minutes after time-up before a court clears itself
const RENT_RATE=c=>c<=4?250:350, OPEN_RATE=100, OPEN_NIGHT_RATE=120, NIGHT_START="18:00"; // OPEN_RATE = flat per player per session (any length)
const QUICK={"Paddle rental":50,"Lesson":150,"VIP room":0,"Pro shop":0,"Food & drinks":0};
const INC_CATS=["Court rental","Open play","Special event",...Object.keys(QUICK)];
const METHODS=["Cash","GCash"];
const EXP_CATS=["Maintenance","Supplies","Staff","Utilities","Rent","Other"];
const ML=m=>m==="rent"?"Rented":m==="event"?"Special event":"Open play";
const SVC=(m,c)=>m==="rent"?"Court "+c+" rental":m==="event"?"Special event":"Open play";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>(n<0?"−":"")+"₱"+Math.abs(n).toFixed(2);
const day=t=>new Date(t).toLocaleDateString("en-CA");
const tm=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dstart=s=>new Date(s+"T00:00:00").getTime();
const fm=m=>m>=60?Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m":m+"m";
const hl=h=>h===12?"12p":h>12?(h-12)+"p":h+"a";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const SUPA_URL="https://ssfdtxjigyiddbjkvsls.supabase.co",SUPA_ANON="sb_publishable_L6hfDfqFcayeZL195m-T0w_oYRAzzXi";
const API=SUPA_URL+"/functions/v1/desk"; // same-server by default; open the app once with ?api=https://your-server/api to point elsewhere
let STAFF=ls("staff")||"",KEY=ls("deskkey")||"",DEV=ls("deviceid")||"",DEVNAME=ls("devname")||"";
if(!DEV){DEV=uid();save("deviceid",DEV)}
let tab="desk",range="today",sdate=day(Date.now()),reportRange="day",reportDate=day(Date.now()),back=null,curSid=null;
let players=[],allTx=[],txns=[],sessions=[],staffList=[];
const COLS=["players","txns","sessions","staff"];
let server={players:[],txns:[],sessions:[],staff:[]},outbox=[],epoch=0,flushing=false,online=true,loaded=false,syncMsg="",retryT=null,pulled=false;
const draft={};

// ================= setup / staff
function setupScreen(){return new Promise(res=>{
 if(KEY&&DEVNAME)return res();
 const d=document.createElement("div");
 d.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:30;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));overflow:auto";
 d.innerHTML='<div class="card"><h2 style="margin:0 0 8px">Set up this device</h2>'+
  '<label>Device name (e.g. Front desk)</label><input id="s2" value="'+esc(DEVNAME)+'" autocomplete="off">'+
  '<label>Access key</label><input id="s3" type="password" value="'+esc(KEY)+'">'+
  '<p><button class="btn" id="sg" style="width:100%">Continue</button></p></div>';
 document.body.appendChild(d);
 d.querySelector("#sg").onclick=()=>{
  const b=d.querySelector("#s2").value.trim(),c=d.querySelector("#s3").value.trim();
  if(!b||!c)return alert("Please fill in both fields");
  DEVNAME=b;KEY=c;save("devname",b);save("deskkey",c);d.remove();res()};
})}
function keyBad(){try{localStorage.removeItem("deskkey")}catch(e){}if(!window._r){window._r=1;alert("Wrong access key. Please enter it again.");location.reload()}}

// ================= local-first storage + sync with Google Sheet
async function api(fn,args){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:KEY,fn:fn,args:args,staff:STAFF,dev:DEV,devname:DEVNAME,ua:navigator.userAgent})});
 let j;try{j=await r.json()}catch(e){throw new Error("Reply was not JSON. Check the web app access is Anyone and a new version is deployed.")}
 if(!j.ok&&/access key/i.test(j.error||""))keyBad();
 return j}
const clone=o=>JSON.parse(JSON.stringify(o));
function applyOp(a,op){
 if(op.op==="add"){if(!a.some(x=>x.id===op.o.id))a.push(clone(op.o))}
 else if(op.op==="upd"){const x=a.find(y=>y.id===op.id);if(x)Object.assign(x,clone(op.patch))}
 else if(op.op==="del"){const i=a.findIndex(y=>y.id===op.id);if(i>-1)a.splice(i,1)}}
function rebuild(){
 const D={};COLS.forEach(c=>{const a=clone(server[c]||[]);outbox.filter(o=>o.c===c).forEach(o=>applyOp(a,o));D[c]=a});
 players=D.players;staffList=D.staff;allTx=D.txns;sessions=D.sessions;txns=allTx.filter(t=>t.type==="income"||t.type==="expense")}
function q(op){
 if(op.op==="add")op.o.by=STAFF;
 if(op.op==="add"&&op.o&&Array.isArray(op.o.log))op.o.log.forEach(x=>{if(!x.u)x.u=STAFF});
 if(op.op==="upd"&&op.patch&&Array.isArray(op.patch.log)){const x=op.patch.log[op.patch.log.length-1];if(x&&!x.u)x.u=STAFF}
 outbox.push(op);epoch++;save("outbox",JSON.stringify(outbox));rebuild();refresh();status();flush()}
async function flush(){
 if(flushing)return;flushing=true;let net=false;
 try{
  while(outbox.length){
   const batch=outbox.slice(0,40),ops=batch.map(o=>({fn:o.op==="add"?"addRow":o.op==="upd"?"updateRow":"deleteRow",args:o.op==="add"?[o.c,o.o]:o.op==="upd"?[o.c,o.id,o.patch]:[o.c,o.id]}));
   let r;try{r=await api("batch",[ops])}catch(e){net=true;online=false;syncMsg=String(e.message||e);break}
   if(!r.ok){online=false;syncMsg=r.error||"Server error";break}
   (r.data||[]).forEach(x=>{if(x&&!x.ok&&!/Row not found/i.test(x.error||""))alert("Not saved: "+x.error)});
   outbox.splice(0,batch.length);epoch++;save("outbox",JSON.stringify(outbox));online=true;syncMsg="";
  }
 }finally{flushing=false}
 if(outbox.length){clearTimeout(retryT);retryT=setTimeout(flush,10000)}else await pull();
 rebuild();refresh();status()}
let lastVer=null;
async function verNow(){ // tiny "anything new?" check, no server function involved
 if(!SUPA_ANON)return null;
 try{const h={apikey:SUPA_ANON,"Content-Type":"application/json"};if(SUPA_ANON.startsWith("eyJ"))h.Authorization="Bearer "+SUPA_ANON;
  const r=await fetch(SUPA_URL+"/rest/v1/rpc/desk_ver",{method:"POST",headers:h,body:"{}"});return r.ok?await r.json():null}catch(e){return null}}
async function pull(){
 if(flushing||outbox.length)return;const ep=epoch;
 try{
  const v=await verNow();
  if(v!==null&&v===lastVer&&loaded){online=true;syncMsg="";status();return}
  let got;const ra=await api("listAll",[]);
  if(ra.ok)got=ra.data;else{got={};for(const c of COLS){const r=await api("listRows",[c]);if(!r.ok)throw new Error(r.error);got[c]=r.data}}
  if(ep!==epoch||outbox.length||flushing)return;
  server=got;lastVer=v;loaded=true;online=true;syncMsg="";save("cache",JSON.stringify(server));rebuild();refresh();status()
 }catch(e){online=false;syncMsg=String(e.message||e);status()}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
async function syncNow(){
 try{const r=await api("ping",[]);alert(r.ok?"Connected: "+r.data+(outbox.length?"\n"+outbox.length+" change(s) waiting to upload.":"\nAll changes are saved."):"Server error: "+r.error)}
 catch(e){alert("Cannot reach the server.\n"+(e.message||e)+"\nYour entries are kept on this device and will upload automatically.")}
 flush();pull()}
function status(){const b=$("#sync");if(!b)return;
 if(outbox.length){b.className="btn s g warn";b.textContent=online?"● Saving "+outbox.length+"…":"● Offline – "+outbox.length+" waiting"}
 else if(!online){b.className="btn s g bad";b.textContent="● Not connected"}
 else if(!loaded){b.className="btn s g";b.textContent="● Connecting…"}
 else{b.className="btn s g ok";b.textContent="● Saved to cloud ✓"}}

// ================= helpers
const sum=(l,type)=>l.filter(x=>x.type===type).reduce((a,x)=>a+x.amt,0);
const inRange=t=>{const d=new Date(t),n=new Date();
 if(range==="today")return day(t)===day(n);
 if(range==="week")return n-d<7*864e5;
 if(range==="month")return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
 return true};
const actv=p=>!p.outAt&&p.status!=="done";
const closedNow=n=>new Date(n).getHours()<OPEN_H;
function pst(p,n){n=n||Date.now();
 if(!actv(p))return"done";if(!p.until||!p.court)return"waiting";
 const st=p.startAt||p.inAt;
 if(p.ci===false?n<=p.until:(!p.ci&&n<st))return"reserved";
 if(p.ci&&n<st)return"arrived";
 if(n>p.until)return openLive(sessions.find(s=>s.id===p.sid))?"playing":"overtime";return"playing"}
const sessPlayers=sid=>players.filter(p=>p.sid===sid&&actv(p));
const openLive=s=>!!s&&s.mode==="open"&&s.openEnded===true&&!s.closed;
const openRate=(s,t)=>{const d=new Date(t),cut=(s.nightStart||NIGHT_START).split(":").map(Number);return Math.round(+(d.getHours()*60+d.getMinutes()>=cut[0]*60+(cut[1]||0)?(s.nightRate??s.rate??OPEN_NIGHT_RATE):(s.dayRate??s.rate??OPEN_RATE))||0)};
const openPeriod=(s,t)=>{const d=new Date(t),cut=(s.nightStart||NIGHT_START).split(":").map(Number);return d.getHours()*60+d.getMinutes()>=cut[0]*60+(cut[1]||0)?"Night":"Day"};
function conflict(court,start,end,ign){return sessions.find(s=>!s.closed&&s.court===court&&s.id!==ign&&s.start<end&&(openLive(s)||start<s.until))}
function courtState(c,n){
 const ss=sessions.filter(s=>!s.closed&&s.court===c);
 const cur=ss.find(s=>s.start<=n&&(openLive(s)||n<s.until));
 const over=ss.find(s=>!openLive(s)&&s.until<=n&&sessPlayers(s.id).length>0);
 const next=ss.filter(s=>s.start>n).sort((a,b)=>a.start-b.start)[0];
 return{cur,over,next}}
function rangeTabs(){return `<div class="tabs">${["today","week","month","all"].map(r=>`<button class="btn s ${r===range?"":"g"}" onclick="range='${r}';refresh()">${r==="week"?"7 days":r==="month"?"This month":r[0].toUpperCase()+r.slice(1)}</button>`).join("")}</div>`}
// Reports use the explicitly chosen calendar day, Monday-to-Sunday week, or month.
function reportBounds(){
 const d=dstart(reportDate||day(Date.now())),v=new Date(d);
 if(reportRange==="month")return [new Date(v.getFullYear(),v.getMonth(),1).getTime(),new Date(v.getFullYear(),v.getMonth()+1,1).getTime()];
 if(reportRange==="week"){const monday=d-((v.getDay()+6)%7)*86400000;return [monday,monday+7*86400000]}
 return [d,d+86400000];
}
function reportMatch(t){const [start,end]=reportBounds();return +t>=start&&+t<end}
function reportControls(){
 const [a,b]=reportBounds(),end=new Date(b-1);

function saveSession(){
 const f=$("#sf"),now=Date.now(),court=+f.court.value,mode=f.mode.value,hours=mode==="open"?0:+f.hours.value,max=Math.max(1,+f.max.value||12),rate=mode==="open"?+f.dayRate.value:+f.rate.value||0;

 if(start<now-10*60000)return alert("That start time has already passed");

 names.forEach((nm,i)=>{

  if(isPaid&&fee>0)log.push({t:now,e:"Paid "+money(fee)+" ("+method+")"+refTxt});

  if(isPaid&&fee>0)q({op:"add",c:"txns",dep:sid,o:{id:uid(),t:now,type:"income",cat:mode==="rent"?"Court "+court+" rental":SVC(mode,court),amt:fee,method,note:nm+refTxt+" · Court "+court}})});
 closeModal();refresh()}

// ================= manage a booked / running court
function pLine(p,n){const s=pst(p,n);
 const t=s==="playing"?fm(Math.max(0,Math.ceil((p.until-n)/60000)))+" left":s==="overtime"?"OVERTIME "+fm(Math.ceil((n-p.until)/60000)):s==="arrived"?"arrived · starts "+tm(p.startAt):s==="reserved"?(n>=(p.startAt||0)?"awaiting arrival · was "+tm(p.startAt):"reserved · starts "+tm(p.startAt)):"";
 return{s,t}}
function manage(sid){
 const s=sessions.find(x=>x.id===sid);if(!s)return;curSid=sid;
 const n=Date.now(),ps=sessPlayers(sid),st=n<s.start?"Reserved":openLive(s)||n<s.until?ML(s.mode):"Time ended";
 const rem=Math.max(0.5,Math.ceil((s.until-Math.max(n,s.start))/1800000)/2);
 const ov=n>=s.until&&ps.length>0,nxt=ov&&sessions.find(x=>!x.closed&&x.court===s.court&&x.id!==sid&&x.start<=n&&n<x.until);
 modal(`<div class="row"><h3 style="margin:0">Court ${s.court} · ${st}</h3><button class="btn s g" onclick="closeModal()">Close</button></div>
 <div class="note">${new Date(s.start).toLocaleDateString()} · ${tm(s.start)} – ${openLive(s)?"Open until ended":tm(s.until)+" ("+s.hours+" hr)"} · ${s.mode==="rent"?"Rented court":ML(s.mode)}${s.mode!=="rent"?" · "+money(s.rate||0)+"/player":""} · ${ps.length}/${s.max} players · set by ${esc(s.by||"")}</div>
 ${ov?`<div style="background:var(--red2);border:2px solid var(--red);border-radius:10px;padding:10px;margin:8px 0"><b style="color:var(--red);font-size:17px">⚠️ OVERTIME ${fm(Math.ceil((n-s.until)/60000))}</b><div class="note" style="color:var(--tx)">${nxt?"Next renter's slot started "+tm(nxt.start)+". Hand over the court.":"Time is up. Extend or end the session."}</div><div class="row" style="justify-content:flex-start;margin-top:8px;flex-wrap:wrap">${nxt?"":`<button class="btn s" onclick="extendModal('${sid}')">Extend</button>`}<button class="btn s r" onclick="endSession('${sid}')">${nxt?"Hand over to next renter":"End session"}</button></div></div>`:""}
 <div style="margin-top:8px">${ps.map(p=>{const i=pLine(p,n);return `<div style="border-top:1px solid var(--bd);padding:8px 0"><div class="row"><div><b>${esc(p.name)}</b> <span class="pill p-${i.s}">${i.s}</span>${p.role==="renter"?' <span class="note">renter</span>':""}<div class="note">${i.t} · <span class="${p.paid?"paid":"unpaid"}">${p.fee===0?"Included":p.paid?"Paid "+money(p.fee)+" ("+esc(p.method)+")":"Unpaid "+money(p.fee)}</span></div></div></div>
 <div class="row" style="justify-content:flex-start;margin-top:6px">${p.paid?"":`<button class="btn s" onclick="collectModal('${p.id}')">Collect ${money(p.fee)}</button>`}${i.s==="reserved"?`<button class="btn s" onclick="checkin('${p.id}')">✅ Check in</button>`:`<button class="btn s r" onclick="checkout('${p.id}')">Check out</button>`}</div></div>`}).join("")||'<p class="note">No players on this court yet.</p>'}</div>
 ${ps.length<s.max&&(openLive(s)||n<s.until)?`<form id="pf" style="border-top:1px solid var(--bd);margin-top:6px" onsubmit="event.preventDefault();addPlayer('${sid}')"><label>Add a player (${ps.length}/${s.max})</label><input name="pname" placeholder="Player name" autocomplete="off">
 ${s.mode!=="rent"?`<div class="grid">${s.mode==="open"?"":`<div><label>Hours</label><input name="hrs" type="number" min="0.5" step="0.5" value="${rem}"></div>`}<div><label>Payment</label><select name="paid"><option value="yes">Paid now</option><option value="no">Pay later</option></select></div></div><div class="note">${s.mode==="open"?openPeriod(s,n)+" rate: "+money(openRate(s,n))+" per player; no hourly limit":"Flat fee: "+money(s.rate||0)+" per player per session."}</div><div class="grid"><div><label>Mode of payment</label><select name="method">${METHODS.map(m=>`<option>${m}</option>`).join("")}</select></div><div><label>GCash ref #</label><input name="ref"></div></div>`:'<div class="note">Joins this rented court at no extra charge.</div>'}
 <p><button class="btn" style="width:100%">Add player</button></p></form>`:""}
 <div class="grid" style="margin-top:6px"><div><label>Max players</label><input id="mx" type="number" min="1" max="50" value="${s.max}"></div><div style="align-self:end"><button class="btn g" style="width:100%" onclick="setMax('${sid}')">Update max</button></div></div>
 <p><button class="btn r" style="width:100%" onclick="endSession('${sid}')">${n<s.start?"Cancel this booking":"End session now"}</button></p>`)}
function reopen(){if(curSid)manage(curSid)}
function addPlayer(sid){
 const f=$("#pf"),s=sessions.find(x=>x.id===sid),n=Date.now(),name=f.pname.value.trim();
 if(!name)return alert("Enter the player's name");
 if(sessPlayers(sid).length>=s.max)return alert("This court is full ("+s.max+" players max)");
 if(s.closed||(!openLive(s)&&n>=s.until))return alert("This session has ended");
 const rem=Math.max(0.5,Math.ceil((s.until-Math.max(n,s.start))/1800000)/2),open=s.mode!=="rent";
 const hrs=s.mode==="open"?0:open?(+f.hrs.value||rem):rem,fee=s.mode==="open"?openRate(s,n):open?Math.round(s.rate||0):0;
 const paid=fee===0?true:f.paid.value==="yes",method=open?f.method.value:"",ref=open?f.ref.value.trim():"",refTxt=paid&&method==="GCash"&&ref?" · Ref "+ref:"";
 const until=s.mode==="open"?s.until:Math.min(s.until,Math.max(n,s.start)+hrs*H),log=[{t:n,e:"Joined Court "+s.court}];
 if(paid&&fee>0)log.push({t:n,e:"Paid "+money(fee)+" ("+method+")"+refTxt});

 if(paid&&fee>0)q({op:"add",c:"txns",o:{id:uid(),t:n,type:"income",cat:SVC(s.mode,s.court),amt:fee,method,note:name+refTxt+" · Court "+s.court}});

// Record omitted Open Play participants without reopening completed sessions.
function lateOpenModal(){
 const now=Date.now(),cutoff=now-30*86400000;

  .sort((a,b)=>b.start-a.start);

 <div class="grid"><div><label>Payment</label><select name="paid"><option value="yes">Paid</option><option value="no">Pay later</option></select></div>

 <label>GCash reference (optional)</label><input name="ref" autocomplete="off">
 <div class="note">The session's original per-player rate is used. Payment received now is recorded now; unpaid players remain collectible.</div>

function lateOpenInfo(){

function saveLateOpen(){
 const f=$("#latepf");if(!f)return;
 const s=sessions.find(x=>x.id===f.sid.value&&x.mode==="open");
 if(!s)return alert("Select an existing Open Play session.");
 const names=f.names.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!names.length)return alert("Enter at least one player name.");
 const existing=players.filter(p=>p.sid===s.id&&p.role!=="extension");
 if(existing.length+names.length>s.max)return alert("Session capacity is "+s.max+". Increase the maximum on the court first if needed.");
 const duplicates=names.filter((name,i)=>names.findIndex(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())!==i||existing.some(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()));
 if(duplicates.length&&!confirm("These names already appear in this session or in your entry: "+[...new Set(duplicates)].join(", ")+". Add anyway?"))return;

 names.forEach(name=>{

  if(paid&&fee>0)log.push({t:n,e:"Paid "+money(fee)+" ("+method+")"+refTxt});
  q({op:"add",c:"players",o:{id:uid(),name,phone:"",sid:s.id,court:s.court,mode:"open",role:"player",service:"Open play",hours:s.hours,fee,paid,method:paid&&fee>0?method:"",status:historical?"done":"active",ci:true,startAt:s.start,until:s.until,inAt:s.start,outAt:historical?(s.closedAt||s.until):null,log}});
  if(paid&&fee>0)q({op:"add",c:"txns",o:{id:uid(),t:n,type:"income",cat:"Open play",amt:fee,method,note:name+refTxt+" · Court "+s.court+" · late entry for "+new Date(s.start).toLocaleDateString()}})});
 closeModal();refresh();alert(names.length+" late Open Play player"+(names.length===1?"":"s")+" recorded. "+(paid?"Payment entered in today's ledger.":"Unpaid balance added."))}
function extendModal(sid){

 <label>Extension fee (₱, total)</label><input name="fee" type="number" min="0" step="1" value="${rent?Math.round((+s.rate||0)*h0):0}">
 <div class="grid"><div><label>Payment</label><select name="paid"><option value="yes">Paid now</option><option value="no">Pay later</option></select></div><div><label>Mode of payment</label><select name="method">${METHODS.map(m=>`<option>${m}</option>`).join("")}</select></div></div>
 <label>GCash ref # (optional)</label><input name="ref" autocomplete="off">

function exUp(r){const f=$("#ef");if(r)f.fee.value=Math.round(r*(+f.hours.value||0))}
function doExtend(sid){

 if(!s)return;if(!(h>0))return alert("Enter the extra hours");

 const sv=players.filter(p=>p.inAt>lastClose),ss=sessions.filter(s=>s.t>lastClose);
 return{last:cl[0],op,lastClose,cash,gc,cashOut,fl,remit:cash-cashOut,expected:fl+cash-cashOut,sv,ss,unpaid:sv.filter(p=>!p.paid).reduce((a,p)=>a+p.fee,0)}}

function dCourts(){const n=Date.now();let h="";
 for(let c=1;c<=COURTS;c++){
  const{cur,over,next}=courtState(c,n),s=over||cur,closed=closedNow(n);let cls="",label="FREE",l2="",names="";
  if(s){const ps=sessPlayers(s.id);cls=over?"over":(s.mode==="rent"?"rent":"open");
   label=over?"⚠️ OVERTIME":ML(s.mode).toUpperCase();
   l2=over?`ended ${tm(s.until)} · ${fm(Math.ceil((n-s.until)/60000))} over`:openLive(s)?"OPEN · End manually":`until ${tm(s.until)} · ${fm(Math.ceil((s.until-n)/60000))} left`;
   names=(ps.map(p=>esc(p.name)).join(", ")||"no players yet")+` (${ps.length}/${s.max})`}
  if(!s&&closed){cls="closed";label="CLOSED";l2="Opens "+OPEN_H+":00 AM"}
  h+=`<div class="court ${cls}" onclick="courtTap(${c})"><b>Court ${c}</b><div class="cs">${label}</div>${l2?`<small>${l2}</small>`:""}${names?`<small style="color:var(--tx)">${names}</small>`:""}${over?`<small style="color:var(--red);font-weight:800">${cur?"NEXT RENTER WAITING – tap to hand over":"Tap to extend or end"}</small>`:""}${next?`<small>Next: ${tm(next.start)} (${ML(next.mode).toLowerCase()})${sessPlayers(next.id).length?" · "+sessPlayers(next.id).map(p=>esc(p.name)).join(", "):""}</small>`:""}${!s&&!next&&!closed?'<small>Tap to set up</small>':""}</div>`}
 return h}
function courtTap(c){const{cur,over}=courtState(c,Date.now()),s=over||cur;if(s)manage(s.id);else if(closedNow(Date.now()))alert("The venue is closed. It opens at 8:00 AM.");else setupModal({court:c})}
function dSched(){const n=Date.now(),base=dstart(sdate);
 let h='<table class="sch"><tr><td></td>'+[...Array(CLOSE_H-OPEN_H)].map((_,i)=>`<th>${hl(OPEN_H+i)}</th>`).join("")+"</tr>";
 for(let c=1;c<=COURTS;c++){h+=`<tr><td class="cn">Ct ${c}</td>`;
  for(let k=OPEN_H;k<CLOSE_H;k++){
   const a=base+k*H,b=a+H,s=sessions.find(x=>!x.closed&&x.court===c&&x.start<b&&(openLive(x)||x.until>a)),past=b<=n,blk=past||(sdate===day(n)&&closedNow(n)),cur=a<=n&&n<b;
   const cls=(s?(s.mode==="rent"?"b-rent":"b-open"):"")+(past&&!s?" past":"")+(blk&&!past&&!s?" closed":"")+(cur?" nowc":"");
   h+=`<td class="sl ${cls}" ${s?`onclick="manage('${s.id}')" title="${esc(ML(s.mode))} ${tm(s.start)}–${tm(s.until)}"`:blk?"":`onclick="setupModal({court:${c},date:'${sdate}',start:${a}})"`}></td>`}
  h+="</tr>"}
 return (sdate===day(n)&&closedNow(n)?'<div class="note" style="color:var(--red);font-weight:700;margin-bottom:4px">Closed until 8:00 AM – booking is disabled for today. Choose a later date.</div>':"")+h+"</table>"}
function grp(list,byStart){const m=new Map();list.forEach(p=>{const k=p.sid||"x"+p.id;if(!m.has(k))m.set(k,[]);m.get(k).push(p)});
 const sv=k=>sessions.find(x=>x.id===k)||{};
 return [...m.entries()].sort((a,b)=>byStart?(sv(a[0]).start||0)-(sv(b[0]).start||0):(sv(a[0]).court||99)-(sv(b[0]).court||99))}
function gHead(s,ps,rv){const rent=s&&s.mode==="rent";
 return `<div class="row" style="background:${rent?"var(--org2)":"var(--ac2)"};border-left:4px solid ${rent?"var(--org)":"var(--ac)"};border-radius:8px;padding:8px 10px;margin:10px 0 2px"><b style="font-size:13px">${s&&s.court?`Court ${s.court} · ${ML(s.mode)} · ${tm(s.start)}–${tm(s.until)} · ${ps.length}/${s.max}`:"Walk-in"}</b><span style="display:flex;gap:6px">${rv&&s?`<button class="btn s" onclick="checkinAll('${s.id}')">Check in all</button>`:""}${s&&s.court?`<button class="btn s g" onclick="manage('${s.id}')">Court</button>`:""}</span></div>`}
function pRow(p,n,rv){const i=pLine(p,n);
 return `<div style="padding:7px 4px;border-bottom:1px solid var(--bd)"><div class="row"><div><b>${esc(p.name)}</b> <span class="pill p-${i.s}">${i.s}</span>${p.role==="renter"?' <span class="note">renter</span>':""}${i.t?`<div class="note"><b style="color:${i.s==="overtime"?"var(--red)":"inherit"}">${i.t}</b></div>`:""}</div>${rv?`<button class="btn s" onclick="checkin('${p.id}')">✅ Check in</button>`:`<button class="btn s r" onclick="checkout('${p.id}')">Check out</button>`}</div>
 <details><summary class="note">Activity log</summary><div class="log">${(p.log||[]).map(x=>`${tm(x.t)} — ${esc(x.e)}${x.u?" · "+esc(x.u):""}`).join("<br>")}</div></details></div>`}
function dActive(){const n=Date.now(),l=players.filter(p=>actv(p)&&pst(p,n)!=="reserved");
 if(!l.length)return '<p class="note">No active players.</p>';
 return grp(l).map(([k,ps])=>{ps.sort((a,b)=>(b.role==="renter")-(a.role==="renter")||a.inAt-b.inAt);const s=sessions.find(x=>x.id===k);return gHead(s,ps,false)+ps.map(p=>pRow(p,n,false)).join("")}).join("")}
function dResv(){const n=Date.now(),l=players.filter(p=>actv(p)&&pst(p,n)==="reserved");
 if(!l.length)return '<p class="note">No reservations waiting.</p>';
 return grp(l,true).map(([k,ps])=>{ps.sort((a,b)=>(b.role==="renter")-(a.role==="renter")||a.inAt-b.inAt);const s=sessions.find(x=>x.id===k);return gHead(s,ps,true)+ps.map(p=>pRow(p,n,true)).join("")}).join("")}
function checkinAll(sid){const n=Date.now(),l=players.filter(p=>p.sid===sid&&actv(p)&&pst(p,n)==="reserved");if(!l.length)return;
 l.forEach(p=>q({op:"upd",c:"players",id:p.id,patch:{ci:true,arrivedAt:n,log:[...(p.log||[]),{t:n,e:"Checked in (arrived)"}]}}));
 const un=l.filter(p=>!p.paid);if(un.length)alert("💸 Unpaid: "+un.map(p=>p.name+" "+money(p.fee)).join(", ")+". Please collect.");
 refresh()}

function openRef(p){
 const lines=(p.log||[]).map(x=>String(x.e||""));
 for(let i=lines.length-1;i>=0;i--){
  const m=lines[i].match(/\bRef\s*#?\s*([^\s·,;]+)/i);
  if(m)return m[1];
 }
 // Support historic player data where the reference was only recorded in a transaction note.
 const t=allTx.find(x=>x.type==="income"&&x.method==="GCash"&&x.cat==="Open play"&&
  String(x.note||"").toLowerCase().startsWith(String(p.name||"").toLowerCase()+" ·")&&
  day(x.t)===day(p.inAt)&&/\bRef\s*#?\s*([^\s·,;]+)/i.test(x.note||""));
 return t?(String(t.note).match(/\bRef\s*#?\s*([^\s·,;]+)/i)||[])[1]||"":"";
}
function dReports(){
 const l=txns.filter(t=>reportMatch(t.t)),by=(type,k)=>{const m={};l.filter(t=>t.type===type).forEach(t=>m[t[k]||"-"]=(m[t[k]||"-"]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const tbl=(title,rows)=>`<div class="card"><b>${title}</b>${rows.map(([k,v])=>`<div class="row" style="padding:5px 0"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join("")||'<p class="note">No data.</p>'}</div>`;
 const pl=players.filter(p=>reportMatch(p.inAt)&&p.role!=="extension"),uniq=new Set(pl.map(p=>(p.name||"").toLowerCase())).size;
 const op=pl.filter(p=>p.mode==="open"||p.service==="Open play").sort((a,b)=>a.inAt-b.inAt);
 const cash=op.filter(p=>p.paid&&p.method==="Cash").reduce((a,p)=>a+(+p.fee||0),0);
 const gcash=op.filter(p=>p.paid&&p.method==="GCash").reduce((a,p)=>a+(+p.fee||0),0);
 const paid=op.filter(p=>p.paid).reduce((a,p)=>a+(+p.fee||0),0);
 const owing=op.filter(p=>!p.paid).reduce((a,p)=>a+(+p.fee||0),0);
 const summary=[["Players",String(op.length)],["Cash",money(cash)],["GCash",money(gcash)],["Total paid",money(paid)],["Unpaid",money(owing)]];
 const sheet=`<div class="card"><div class="row"><b>Open Play payment report</b><span class="note">${reportRange==="day"?"Selected day":reportRange==="week"?"Selected week":"Selected month"}</span></div>
 <div class="op-sheet"><table class="op-table"><thead><tr><th>Time in</th><th>Open Play</th><th>Amount paid</th><th>GCash ref #</th></tr></thead>
 <tbody>${op.map(p=>`<tr><td>${tm(p.inAt)}${reportRange!=="day"?`<span class="subcell">${esc(day(p.inAt))}</span>`:""}</td><td><b>${esc(p.name)}</b>${p.court?`<span class="subcell">Court ${p.court}</span>`:""}</td><td class="amount">${p.paid?money(+p.fee||0):"—"}<span class="subcell">${p.paid?esc(p.method||"Paid"):"Unpaid "+money(+p.fee||0)}</span></td><td class="ref">${p.paid&&p.method==="GCash"?esc(openRef(p))||"—":"—"}</td></tr>`).join("")||'<tr><td colspan="4" style="text-align:center;padding:20px">No Open Play players for this period.</td></tr>'}</tbody>
 <tfoot><tr><td colspan="2">TOTAL · ${op.length} players</td><td class="amount">${money(paid)}</td><td></td></tr></tfoot></table></div></div>`;
 return `<div class="op-summary">${reportControls()}<div class="op-totals">${summary.map(([k,v])=>`<div class="op-total"><span>${k}</span><b>${v}</b></div>`).join("")}</div></div>`+
 sheet+`<div class="report-breakdowns">`+
 `<div class="card"><div class="row"><b>All services overview</b><span class="note">${pl.length} visits · ${uniq} unique players</span></div></div>`+
 tbl("Income by service",by("income","cat"))+tbl("Income by payment mode",by("income","method"))+tbl("Income by staff",by("income","by"))+tbl("Expenses by category",by("expense","cat"))+
 `<div class="card"><b>Outstanding balances</b>${players.filter(p=>!p.paid&&reportMatch(p.inAt)).map(p=>`<div class="row" style="padding:5px 0"><span>${esc(p.name)} <span class="note">${new Date(p.inAt).toLocaleDateString()}</span></span><span><b class="unpaid">${money(p.fee||0)}</b> <button class="btn s" onclick="collectModal('${p.id}')">Collect</button></span></div>`).join("")||'<p class="note">All settled.</p>'}</div></div>`;
}

function dShInv(){const s=shiftCalc(),n=Date.now();let rows="";
 for(let c=1;c<=COURTS;c++){
  const ss=s.ss.filter(x=>x.court===c),ids=ss.map(x=>x.id),pl=s.sv.filter(p=>ids.includes(p.sid));
  const hr=m=>ss.filter(x=>m==="rent"?x.mode==="rent":x.mode!=="rent").reduce((a,x)=>a+(x.hours||0),0),col=pl.filter(p=>p.paid).reduce((a,p)=>a+(+p.fee||0),0);

  <div class="card"><b>End shift &amp; remit</b><form data-d="es" onsubmit="event.preventDefault();endShift(this)"><label>Counted cash in drawer (₱)</label><input name="cnt" type="number" step="0.01" min="0" required><label>Note (optional)</label><input name="note" autocomplete="off"><p><button class="btn" style="width:100%">End shift &amp; remit</button></p></form></div>
  <div id="shinv"></div>`,dyn:{shtop:dShift,shinv:dShInv},post:shiftPost}};
function drawHead(){$("#date").textContent=new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+(STAFF?" · "+STAFF:"")+" · v"+APP_VER}
function drawNav(){$("#nav").innerHTML=[["desk","🏠","Desk"],["players","👥","Players"],["ledger","💵","Ledger"],["reports","📊","Reports"],["shift","🧾","Shift"]].concat(roleNow()==="admin"?[["staff","👤","Staff"]]:[]).map(([k,i,n])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span class="ni">${i}</span><span>${n}</span></button>`).join("")}
function go(t){tab=t;$("#app").className="t-"+t;drawNav();drawHead();$("#app").innerHTML=VIEWS[t].shell();restoreDrafts();refresh();scrollTo(0,0)}
function refresh(){const v=VIEWS[tab];if(!v||!$("#app"))return;
 for(const id in v.dyn){const el=document.getElementById(id);if(el)el.innerHTML=v.dyn[id]()}
 if(v.post)v.post()}

async function boot(){
 try{const c=JSON.parse(ls("cache")||"null");if(c){server=c;loaded=true}}catch(e){}
 try{outbox=JSON.parse(ls("outbox")||"[]")}catch(e){outbox=[]}
 rebuild();drawHead();status();
 if(!loaded)await pull();
 while(!loaded){overlay('<h2 style="margin:0 0 8px">Connecting…</h2><div class="note">Could not reach the server. Check the internet, then retry.</div><p><button class="btn" id="rt" style="width:100%">Retry</button></p>');
  await new Promise(r=>{$("#rt").onclick=r});await pull()}
 overlayOff();flush();
 if(!STAFF||!meRow()){STAFF="";save("staff","");drawHead();await loginScreen()}
 go("desk");status();
 await shiftGate();
 setInterval(pull,4000);setInterval(autoClose,10000);setTimeout(autoClose,4000);setInterval(()=>{if(!$("#modal")&&!$("#ov"))refresh()},30000);setInterval(drawHead,60000)}
setupScreen().then(boot);
</script>
</body>
